<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudiantes · SIEAGE</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=outfit:400,500,600,700" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- Lo único que no se hace con clases: la entrada suave (en la app: animate-in fade-in slide-in-from-bottom-2 de tw-animate-css). -->
<style type="text/tailwindcss">
@theme {
  --animate-aparecer: aparecer 420ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body class="bg-[#F5F7FC] font-['Outfit',ui-sans-serif,system-ui,sans-serif] text-[#16223F] antialiased">

<!-- ============================================================ encabezado global (panel-layout.tsx; único cambio: 2xl:max-w-[1760px] para alinear con el contenido) -->
<header class="sticky top-0 z-30 border-b border-[#E3E9F6] bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-[1400px] items-center gap-6 px-4 md:px-8 2xl:max-w-[1760px]">
    <a href="#" class="flex shrink-0 items-center gap-3">
      <img src="/sieage-logo.png" alt="SIEAGE" class="h-10 w-auto rounded-md object-contain">
      <div class="hidden leading-tight sm:block">
        <p class="text-[15px] font-semibold tracking-tight">SIEAGE</p>
        <p class="text-xs text-[#56627F]">I.E. Alfonso López Pumarejo</p>
      </div>
    </a>
    <nav class="flex items-center gap-1 rounded-full bg-[#EEF2FB] p-1">
      <a href="#" class="flex items-center gap-2 rounded-full bg-white px-3.5 py-2 text-sm font-medium text-[#1E3A7B] shadow-sm transition">
        <i data-lucide="graduation-cap" class="size-4"></i><span class="hidden md:inline">Estudiantes</span>
      </a>
      <a href="#" class="flex items-center gap-2 rounded-full px-3.5 py-2 text-sm font-medium text-[#56627F] transition hover:text-[#1E3A7B]">
        <i data-lucide="cloud-upload" class="size-4"></i><span class="hidden md:inline">Importar datos</span>
      </a>
    </nav>
    <div class="ml-auto">
      <button class="flex items-center gap-2 rounded-full p-1 pr-3 text-sm transition-colors hover:bg-[#EEF2FB]">
        <span class="flex size-8 items-center justify-center overflow-hidden rounded-full bg-neutral-200 text-sm text-black">A</span>
        <span class="grid flex-1 text-left text-sm leading-tight"><span class="truncate font-medium">Administrador</span></span>
      </button>
    </div>
  </div>
</header>

<!-- Lavado de color de la parte alta: el mismo degradado del login, sin caja. -->
<div aria-hidden="true" class="pointer-events-none fixed inset-x-0 top-[65px] -z-0 h-[270px] overflow-hidden [@media(min-height:860px)]:h-[350px]">
  <div class="absolute inset-0 bg-gradient-to-b from-[#E4EBFA] via-[#EEF2FB] to-[#F5F7FC]"></div>
  <div class="absolute -top-24 right-[8%] size-96 rounded-full bg-white/70 blur-3xl"></div>
  <div class="absolute -top-10 left-[-6%] size-80 rounded-full bg-[#C4D2F1]/60 blur-3xl"></div>
</div>

<main class="relative mx-auto max-w-[1400px] px-4 pt-1.5 pb-2 md:px-8 lg:flex lg:h-[calc(100dvh-4rem-1px)] lg:flex-col 2xl:max-w-[1760px] [@media(min-height:860px)]:pt-4 [@media(min-height:860px)]:pb-4">

  <!-- ============================================================ 1. una sola fila: título + año, grados, búsqueda -->
  <section class="flex shrink-0 flex-wrap items-center gap-x-6 gap-y-3 xl:flex-nowrap">
    <div class="shrink-0">
      <div class="flex items-center gap-2">
        <h1 class="text-[24px] leading-[26px] font-semibold tracking-[-0.025em] [@media(min-height:860px)]:text-[28px] [@media(min-height:860px)]:leading-8">Estudiantes</h1>
        <label class="relative flex items-center" title="Año lectivo">
          <span class="sr-only">Año lectivo</span>
          <select id="anio" class="h-[26px] cursor-pointer appearance-none rounded-full bg-white/75 pr-7 pl-2.5 text-[15px] font-semibold text-[#1E3A7B] tabular-nums ring-1 ring-[#D3DDF3] outline-none transition hover:bg-white focus-visible:ring-2 focus-visible:ring-[#6E8BD6] [@media(min-height:860px)]:h-8 [@media(min-height:860px)]:text-[16px]"></select>
          <i data-lucide="chevron-down" class="pointer-events-none absolute right-2 size-4 text-[#1E3A7B]"></i>
        </label>
      </div>
      <dl id="totales" class="mt-0.5 flex items-baseline gap-1.5 text-[13px] leading-4 whitespace-nowrap text-[#56627F] [@media(min-height:860px)]:mt-1 [@media(min-height:860px)]:text-[14px] [@media(min-height:860px)]:leading-5"></dl>
    </div>

    <nav id="grados" aria-label="Grados"
      class="order-last flex h-11 w-full min-w-0 items-stretch gap-0.5 overflow-x-auto rounded-[16px] bg-[#D3DDF3]/45 p-1 ring-1 ring-white/70 [scrollbar-width:none] xl:order-none xl:w-auto xl:flex-1 [@media(min-height:860px)]:h-[52px] [@media(min-height:860px)]:rounded-[18px]"></nav>

    <div id="busqueda-wrap" class="relative ml-auto w-full sm:w-[300px] xl:ml-0 xl:w-[280px] 2xl:w-[340px]">
      <i data-lucide="search" class="pointer-events-none absolute top-1/2 left-3.5 size-[18px] -translate-y-1/2 text-[#6B7690]"></i>
      <input id="busqueda" type="search" autocomplete="off" spellcheck="false"
        placeholder="Buscar en todo el colegio…"
        aria-label="Buscar estudiante por nombre o documento en todo el colegio"
        class="h-10 w-full rounded-[14px] border-[1.5px] border-[#D3DDF3] bg-white pr-10 pl-10 text-[15px] text-[#16223F] shadow-[0_1px_2px_rgba(22,34,63,0.05)] outline-none transition placeholder:text-[#8C97B3] hover:border-[#B7C6EA] focus:border-[#6E8BD6] focus:ring-4 focus:ring-[#DCE5F8] [&::-webkit-search-cancel-button]:hidden [@media(min-height:860px)]:h-11">
      <kbd id="atajo" title="Atajo: /" class="pointer-events-none absolute top-1/2 right-3 flex h-6 min-w-6 -translate-y-1/2 items-center justify-center rounded-md border border-[#D3DDF3] bg-[#F5F7FC] px-1.5 font-sans text-[12px] text-[#56627F]">/</kbd>
      <button id="limpiar-busqueda" type="button" aria-label="Limpiar búsqueda" class="absolute top-1/2 right-2 hidden size-7 -translate-y-1/2 items-center justify-center rounded-lg text-[#56627F] hover:bg-[#EEF2FB] hover:text-[#16223F]">
        <i data-lucide="x" class="size-4"></i>
      </button>
      <div id="resultados" role="listbox" aria-label="Resultados de la búsqueda"
        class="absolute top-[calc(100%+8px)] right-0 z-50 hidden w-full overflow-hidden rounded-[18px] border border-[#E3E9F6] bg-white shadow-[0_24px_48px_-16px_rgba(22,34,63,0.28)] lg:w-[440px]"></div>
    </div>
  </section>

  <!-- ============================================================ 2. grupos del grado: rótulo de sede + tarjetas -->
  <section id="tablero" aria-label="Grupos del grado" data-desborda="false"
    class="mt-1.5 flex shrink-0 snap-x gap-5 overflow-x-auto pb-1 [scrollbar-width:none] data-[desborda=true]:[mask-image:linear-gradient(to_right,#000_calc(100%-56px),transparent)] [@media(min-height:860px)]:mt-4 [@media(min-height:860px)]:gap-6"></section>

  <!-- ============================================================ 3. lista (+ ficha acoplada en pantallas 2xl) -->
  <div id="zona" class="mt-1.5 flex min-h-[420px] flex-col lg:min-h-0 lg:flex-1 lg:flex-row [@media(min-height:860px)]:mt-3">
    <section aria-label="Lista de estudiantes" class="flex min-h-[420px] min-w-0 flex-1 flex-col overflow-hidden rounded-[24px] border border-[#E3E9F6] bg-white shadow-[0_1px_2px_rgba(22,34,63,0.04),0_12px_32px_-20px_rgba(22,34,63,0.18)] lg:min-h-0">
      <div class="flex shrink-0 flex-col gap-2.5 border-b border-[#EEF2F9] px-4 py-2.5 md:h-[42px] md:flex-row md:items-center md:gap-4 md:px-5 md:py-0 [@media(min-height:860px)]:md:h-12">
        <div id="alcance" class="flex min-w-0 flex-wrap items-center gap-x-2.5 gap-y-1 md:flex-nowrap"></div>
        <div id="estados" role="group" aria-label="Estado" class="flex shrink-0 gap-0.5 rounded-[11px] bg-[#F1F4FA] p-[3px]"></div>
        <p id="pista" class="ml-auto hidden shrink-0 items-center gap-1.5 text-[12px] text-[#6B7690] xl:flex">
          <kbd class="flex h-5 min-w-5 items-center justify-center rounded-[5px] border border-[#E3E9F6] bg-[#F5F7FC] font-sans text-[12px] text-[#3E4A68]">↑</kbd><kbd class="flex h-5 min-w-5 items-center justify-center rounded-[5px] border border-[#E3E9F6] bg-[#F5F7FC] font-sans text-[12px] text-[#3E4A68]">↓</kbd><span>moverse</span>
          <kbd class="ml-1.5 flex h-5 items-center rounded-[5px] border border-[#E3E9F6] bg-[#F5F7FC] px-1 font-sans text-[12px] text-[#3E4A68]">Enter</kbd><span>ver ficha</span>
        </p>
        <div class="relative md:ml-auto md:w-[220px] xl:ml-0 2xl:w-[260px]">
          <i data-lucide="list-filter" class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-[#6B7690]"></i>
          <input id="filtro" type="search" autocomplete="off" spellcheck="false" placeholder="Filtrar esta lista"
            aria-label="Filtrar la lista por nombre, documento o acudiente" aria-describedby="filtro-cuenta"
            class="h-9 w-full rounded-[12px] border-[1.5px] border-[#E3E9F6] bg-white pr-[84px] pl-9 text-sm outline-none transition placeholder:text-[#8C97B3] hover:border-[#D3DDF3] focus:border-[#6E8BD6] focus:ring-4 focus:ring-[#DCE5F8] [&::-webkit-search-cancel-button]:hidden">
          <span id="filtro-cuenta" aria-live="polite" class="pointer-events-none absolute top-1/2 right-9 -translate-y-1/2 text-[13px] whitespace-nowrap text-[#56627F] tabular-nums"></span>
          <button id="filtro-limpiar" type="button" aria-label="Quitar el filtro de texto" class="absolute top-1/2 right-1.5 hidden size-7 -translate-y-1/2 items-center justify-center rounded-lg text-[#56627F] hover:bg-[#EEF2FB] hover:text-[#16223F]">
            <i data-lucide="x" class="size-4"></i>
          </button>
        </div>
      </div>

      <div id="lista" class="relative min-h-0 flex-1 overflow-y-auto overscroll-contain [scrollbar-color:#C4D2F1_transparent] [scrollbar-width:thin]">
        <table class="w-full table-fixed border-separate border-spacing-0 text-sm">
          <thead id="encabezado"></thead>
          <tbody id="filas"></tbody>
        </table>
        <div id="vacio" class="hidden"></div>
      </div>
    </section>

    <!-- Ficha: panel flotante (< 2xl) o columna acoplada (2xl). -->
    <aside id="ficha" role="dialog" aria-modal="false" aria-label="Ficha del estudiante" tabindex="-1" data-abierta="false"
      class="fixed top-[65px] right-0 bottom-0 z-40 flex w-full translate-x-[110%] flex-col overflow-hidden bg-white shadow-[0_32px_64px_-24px_rgba(22,34,63,0.45),0_0_0_1px_rgba(22,34,63,0.05)] transition-[transform,width,margin] duration-300 ease-[cubic-bezier(0.2,0.8,0.2,1)] outline-none data-[abierta=true]:translate-x-0 sm:top-[125px] sm:right-3 sm:bottom-3 sm:w-[460px] sm:rounded-[24px] [@media(min-height:860px)]:sm:top-[149px] 2xl:static 2xl:z-auto 2xl:w-0 2xl:translate-x-0 2xl:shadow-none 2xl:data-[abierta=true]:ml-3 2xl:data-[abierta=true]:w-[480px] 2xl:data-[abierta=true]:shadow-[0_1px_2px_rgba(22,34,63,0.04),0_12px_32px_-20px_rgba(22,34,63,0.18),0_0_0_1px_#E3E9F6]">
      <div id="ficha-cuerpo" class="flex h-full w-full flex-col 2xl:w-[480px]"></div>
    </aside>
  </div>
</main>

<div id="velo" aria-hidden="true" class="pointer-events-none fixed inset-x-0 top-[65px] bottom-0 z-30 bg-[#16223F]/[0.07] opacity-0 transition-opacity duration-300 2xl:hidden"></div>

<!-- ============================================================ aviso discreto -->
<div id="aviso" role="status" aria-live="polite"
  class="pointer-events-none fixed bottom-6 left-1/2 z-50 flex -translate-x-1/2 translate-y-3 items-center gap-2.5 rounded-full bg-[#16223F] py-2.5 pr-5 pl-4 text-sm text-white opacity-0 shadow-[0_16px_32px_-12px_rgba(22,34,63,0.6)] transition duration-300"></div>

<script>
/* ------------------------------------------------------------------ utilidades */
const $ = (s, r = document) => r.querySelector(s);
const numero = (n) => Number(n).toLocaleString('es-CO');
const plano = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// Nombres "Apellido Apellido Nombre": iniciales = primer apellido + primer nombre.
const iniciales = (n) => {
  const p = String(n).split(/\s+/).filter(Boolean);
  return ((p[0]?.[0] ?? '') + ((p.length >= 3 ? p[2] : p[1])?.[0] ?? '')).toUpperCase();
};
// "Carlos Andrés Holguín" → "Carlos A. Holguín" solo si es largo; el nombre completo va en el title.
// Directores "Nombre [Nombre] Apellido [Apellido]": primer nombre, inicial del segundo y primer apellido.
const directorCorto = (n) => {
  if (!n || n.length <= 20) return n;
  const p = n.split(/\s+/);
  return p.length < 3 ? n : `${p[0]} ${p[1][0]}. ${p[2]}`;
};
const telefono = (t) => (t && t.length === 10 ? `${t.slice(0, 3)} ${t.slice(3, 6)} ${t.slice(6)}` : t);
const fecha = (v) => (v ? new Date(`${v}T00:00:00`).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '').replace(/ de /g, ' ') : null);
const edad = (v) => {
  if (!v) return null;
  const n = new Date(`${v}T00:00:00`), h = new Date();
  let a = h.getFullYear() - n.getFullYear();
  if (h < new Date(h.getFullYear(), n.getMonth(), n.getDate())) a--;
  return a;
};
const gradoCorto = (g) => (g.numero === 0 ? 'Tr' : `${g.numero}°`);
const palabras = (q) => plano(q.trim()).split(/\s+/).filter(Boolean);
const esAncha = () => matchMedia('(min-width: 1536px)').matches; // 2xl: la ficha se acopla como columna

/* Sedes: un punto de color + nombre. Nada de pastillas rellenas. */
const SEDES = {
  P:  { orden: 0, corto: 'Principal',    punto: 'bg-[#1E3A7B]' },
  LF: { orden: 1, corto: 'LF',           punto: 'bg-[#5B7BD0]' },
  CP: { orden: 2, corto: 'Provivienda',  punto: 'bg-[#23948C]' },
  RP: { orden: 3, corto: 'Rafael Pombo', punto: 'bg-[#D08A1E]' },
  PT: { orden: 4, corto: 'Purificación', punto: 'bg-[#C04E83]' },
};
const sede = (c) => SEDES[c] ?? SEDES.LF;
const punto = (c, extra = '') => `<span aria-hidden="true" class="size-2 shrink-0 rounded-full ${sede(c).punto} ${extra}"></span>`;

/* Situación por excepción: solo se escribe lo que se sale de "activo y antiguo". */
const SITUACION = {
  retirado:   { texto: 'Retirado',   color: 'text-[#A12B2B]', punto: 'bg-[#D05454]' },
  cancelado:  { texto: 'Cancelado',  color: 'text-[#4E566B]', punto: 'bg-[#8C97B3]' },
  trasladado: { texto: 'Trasladado', color: 'text-[#8A5A0B]', punto: 'bg-[#D99A2B]' },
  repitente:  { texto: 'Repitente',  color: 'text-[#8A5A0B]', punto: 'bg-[#D99A2B]' },
  nuevo:      { texto: 'Nuevo',      color: 'text-[#2F56B0]', punto: 'bg-[#5B7BD0]' },
  activo:     { texto: 'Activo',     color: 'text-[#1C6B4A]', punto: 'bg-[#3BA67A]' },
  antiguo:    { texto: 'Antiguo',    color: 'text-[#4E566B]', punto: 'bg-[#AEB7CC]' },
};
const marca = (clave, tam = 'text-[13px]') => {
  const s = SITUACION[clave] ?? SITUACION.cancelado;
  return `<span class="inline-flex items-center gap-1.5 whitespace-nowrap ${tam} font-medium ${s.color}"><span aria-hidden="true" class="size-1.5 rounded-full ${s.punto}"></span>${s.texto}</span>`;
};

/* Resalta cada palabra buscada dentro de un texto (sin distinguir tildes). */
function resaltar(texto, consulta) {
  const ws = palabras(consulta);
  texto = String(texto ?? '');
  if (!ws.length) return esc(texto);
  const p = plano(texto);
  const m = new Array(texto.length).fill(false);
  ws.forEach((w) => { let i = p.indexOf(w); while (i >= 0) { for (let k = i; k < i + w.length; k++) m[k] = true; i = p.indexOf(w, i + 1); } });
  let out = '', dentro = false;
  [...texto].forEach((ch, i) => {
    if (m[i] && !dentro) { out += '<mark class="rounded-[3px] bg-[#FFE9A8] text-inherit">'; dentro = true; }
    if (!m[i] && dentro) { out += '</mark>'; dentro = false; }
    out += esc(ch);
  });
  return out + (dentro ? '</mark>' : '');
}

/* ------------------------------------------------------------------ estado */
let D = null;
const S = { gradoId: 11, grupoId: null, estado: 'activo', filtro: '', sel: null, abierta: false, q: '', res: [], resI: 0 };
const params = new URLSearchParams(location.search);
if (params.get('grado')) S.gradoId = Number(params.get('grado'));

const grado = () => D.grados.find((g) => g.id === S.gradoId);
const pg = () => D.porGrado[String(S.gradoId)] ?? null;
const grupos = () => {
  const p = pg();
  if (!p) return [];
  // En la maqueta los nuevos se cuentan sobre la lista para que cuadren con las marcas «Nuevo»; en la app llegan del controlador.
  const nuevosDe = (id) => p.estudiantes.filter((e) => e.grupo_id === id && e.estado === 'activo' && e.condicion === 'nuevo').length;
  return p.grupos
    .map((g) => ({ ...g, activos: Number(g.activos), nuevos: nuevosDe(g.id) }))
    .sort((a, b) => sede(a.sede_codigo).orden - sede(b.sede_codigo).orden || a.codigo.localeCompare(b.codigo, 'es', { numeric: true }));
};
const estudiantes = () => pg()?.estudiantes ?? [];
const cumpleEstado = (e, clave) => clave === 'todos' || (clave === 'activo' ? e.estado === 'activo' : e.estado !== 'activo');
const cumpleTexto = (e, ws) => ws.every((w) => plano(e.nombre).includes(w) || e.numero_documento.includes(w) || plano(e.acudiente).includes(w));
const delAlcance = () => estudiantes().filter((e) => S.grupoId === null || e.grupo_id === S.grupoId);
const visibles = () => {
  const ws = palabras(S.filtro);
  return delAlcance().filter((e) => cumpleEstado(e, S.estado) && cumpleTexto(e, ws));
};
const suma = (lista, k) => lista.reduce((s, x) => s + x[k], 0);

/* ------------------------------------------------------------------ 1. cabecera */
function pintarCabecera() {
  $('#anio').innerHTML = D.anios.map((a) => `<option value="${a.anio}" ${a.anio === D.anio ? 'selected' : ''}>${a.anio}</option>`).join('');
  const t = D.totales;
  const item = (n, txt) => `<div class="flex items-baseline gap-1"><dt class="sr-only">${txt}</dt><dd class="font-semibold text-[#16223F] tabular-nums">${numero(n)}</dd><span>${txt}</span></div>`;
  const sep = '<span aria-hidden="true" class="text-[#8C97B3]">·</span>';
  $('#totales').innerHTML = [item(t.activos, 'activos'), item(t.nuevos, 'nuevos'), item(t.retirados, 'retirados')].join(sep);
}

/* ------------------------------------------------------------------ 2. grados (segmentos: grado arriba, activos abajo) */
function pintarGrados() {
  let html = '';
  D.grados.forEach((g, i) => {
    if (i > 0 && g.nivel !== D.grados[i - 1].nivel) html += '<span aria-hidden="true" class="mx-0.5 h-6 w-px shrink-0 self-center bg-[#B7C6EA]"></span>';
    const actual = g.id === S.gradoId;
    html += `<button type="button" data-grado="${g.id}" aria-current="${actual ? 'page' : 'false'}" title="${esc(g.nombre)} · ${g.activos} activos · ${g.grupos} grupos"
      class="flex min-w-[46px] flex-1 flex-col items-center justify-center gap-0.5 rounded-[12px] leading-none transition duration-200 [@media(min-height:860px)]:rounded-[14px] ${
        actual
          ? 'bg-white text-[#1E3A7B] shadow-[0_1px_3px_rgba(22,34,63,0.14)] ring-1 ring-[#C4D2F1]'
          : 'text-[#16223F] hover:bg-white/60'
      }">
      <span class="text-[15px] font-semibold tracking-[-0.01em] [@media(min-height:860px)]:text-[17px]">${gradoCorto(g)}</span>
      <span class="text-[13px] tabular-nums ${actual ? 'text-[#5B7BD0]' : 'text-[#56627F]'}">${g.activos}</span>
    </button>`;
  });
  $('#grados').innerHTML = html;
}

/* ------------------------------------------------------------------ 3. tablero de grupos */
// Las tarjetas entran suaves solo al cambiar de grado; al elegir un grupo no parpadean.
let gradoPintado = null;
const tarjetaBase = 'group/t relative flex min-w-[150px] flex-1 basis-0 snap-start flex-col rounded-[18px] px-3.5 pt-2 pb-2 text-left transition duration-200 @container [@media(min-height:860px)]:rounded-[20px] [@media(min-height:860px)]:px-4 [@media(min-height:860px)]:pt-2.5 [@media(min-height:860px)]:pb-3';
const tonoElegido = 'bg-[#1E3A7B] text-white shadow-[0_18px_32px_-18px_rgba(30,58,123,0.9)]';
const tonoNormal = 'bg-white text-[#16223F] shadow-[0_1px_2px_rgba(22,34,63,0.06),0_10px_24px_-18px_rgba(22,34,63,0.35)] ring-1 ring-[#E3E9F6] hover:-translate-y-0.5 hover:ring-[#C4D2F1] hover:shadow-[0_1px_2px_rgba(22,34,63,0.06),0_16px_28px_-16px_rgba(22,34,63,0.35)]';
const rotuloBase = 'flex h-[18px] min-w-0 items-center gap-2 text-[13px] leading-[18px] whitespace-nowrap';
const regla = '<span aria-hidden="true" class="h-px min-w-3 flex-1 bg-[#C4D2F1]"></span>';
const sepR = '<span aria-hidden="true" class="-mx-0.5 text-[#8C97B3]">·</span>';

/* Barra de ocupación: tramo fuerte = antiguos y repitentes; tramo claro = nuevos (solo si no son todos nuevos). */
function barra(x, elegido) {
  const exceso = x.activos > x.cupos;
  const total = Math.max(x.cupos, x.activos, 1);
  const partir = x.nuevos > 0 && x.nuevos < x.activos && !exceso;
  const fuerte = ((partir ? x.activos - x.nuevos : x.activos) / total) * 100;
  const claro = partir ? (x.nuevos / total) * 100 : 0;
  const cFuerte = exceso ? (elegido ? 'bg-[#FF9C9C]' : 'bg-[#D05454]') : elegido ? 'bg-white' : 'bg-[#4F6FC6]';
  const cClaro = elegido ? 'bg-white/45' : 'bg-[#B3C4EE]';
  return `<div aria-hidden="true" class="mt-1 flex h-[5px] overflow-hidden rounded-full ${elegido ? 'bg-white/15' : 'bg-[#E9EEF8]'} [@media(min-height:860px)]:mt-2 [@media(min-height:860px)]:h-1.5">
    <div class="h-full ${cFuerte}" style="width:${fuerte}%"></div>${claro ? `<div class="h-full ${cClaro}" style="width:${claro}%"></div>` : ''}</div>`;
}

function tarjeta(x, { conJornada, i, entrada }) {
  const el = x.id === S.grupoId;
  const exceso = x.activos > x.cupos;
  const dir = x.director ?? 'Sin director asignado';
  const nuevosTxt = x.nuevos === x.activos ? 'todos nuevos' : `${x.nuevos} nuevo${x.nuevos === 1 ? '' : 's'}`;
  return `<button type="button" data-grupo="${x.id}" aria-pressed="${el}" style="animation-delay:${40 + i * 30}ms"
    aria-label="Grupo ${esc(x.codigo)}, ${esc(x.sede)}, jornada ${esc(x.jornada)}: ${x.activos} de ${x.cupos} cupos, ${nuevosTxt}. Director ${esc(dir)}"
    title="${esc(`${x.codigo} · ${x.sede} · ${x.jornada}\n${x.activos} de ${x.cupos} cupos · ${nuevosTxt}\nDirector: ${dir}`)}"
    class="${tarjetaBase} ${entrada} ${el ? tonoElegido : tonoNormal}">
    <span class="flex items-baseline gap-2">
      <span class="text-[20px] leading-[22px] font-semibold tracking-[-0.02em] whitespace-nowrap [@media(min-height:860px)]:text-[22px] [@media(min-height:860px)]:leading-6">${esc(x.codigo)}</span>
      ${conJornada ? `<span class="truncate text-[13px] ${el ? 'text-white/80' : x.jornada === 'Tarde' ? 'font-medium text-[#8A5A0B]' : 'text-[#56627F]'}">${esc(x.jornada)}</span>` : ''}
      <span class="ml-auto shrink-0 text-[13px] tabular-nums ${el ? 'text-white/65' : 'text-[#56627F]'}"><b class="text-[16px] font-semibold ${exceso ? (el ? 'text-[#FFB4B4]' : 'text-[#B42318]') : el ? 'text-white' : 'text-[#16223F]'}">${x.activos}</b>/${x.cupos}</span>
    </span>
    ${barra(x, el)}
    <span class="mt-1 flex min-w-0 items-baseline gap-2 text-[13px] leading-[18px] [@media(min-height:860px)]:mt-2">
      <span class="min-w-0 truncate ${el ? 'text-white/90' : 'text-[#3E4A68]'}"><span class="${el ? 'text-white/60' : 'text-[#6B7690]'}">Dir.</span> ${directorCorto(dir) === dir ? esc(dir) : `<span class="@min-[230px]:hidden">${esc(directorCorto(dir))}</span><span class="hidden @min-[230px]:inline">${esc(dir)}</span>`}</span>
      ${x.nuevos && x.nuevos !== x.activos ? `<span class="ml-auto hidden shrink-0 tabular-nums @min-[230px]:inline ${el ? 'text-white/70' : 'text-[#56627F]'}">${nuevosTxt}</span>` : ''}
    </span>
    ${exceso ? `<span class="absolute -top-2 right-3 rounded-full bg-[#B42318] px-2 py-0.5 text-[12px] leading-4 font-semibold text-white shadow-sm">+${x.activos - x.cupos} sobre el cupo</span>` : ''}
  </button>`;
}

/* Reparto por modalidad: tres valores y "+N" (el resto en el title). */
function repartoModalidad() {
  const act = estudiantes().filter((e) => e.estado === 'activo');
  if (!act.some((e) => e.modalidad)) return '';
  const m = new Map();
  act.forEach((e) => { const k = e.modalidad ?? 'Sin modalidad'; m.set(k, (m.get(k) ?? 0) + 1); });
  const filas = [...m.entries()].sort((a, b) => (a[0] === 'Sin modalidad') - (b[0] === 'Sin modalidad') || b[1] - a[1]);
  const vis = filas.slice(0, 3), resto = filas.slice(3);
  return `<span class="flex min-w-0 items-baseline gap-2 overflow-hidden text-[#56627F]" title="${esc(`Activos por modalidad: ${filas.map(([k, v]) => `${k} ${v}`).join(', ')}`)}">
    <span class="shrink-0">Activos por modalidad</span>
    ${vis.map(([k, v]) => `<span class="shrink-0 text-[#3E4A68]">${esc(k)} <b class="font-semibold text-[#16223F] tabular-nums">${v}</b></span>`).join('<span aria-hidden="true" class="text-[#8C97B3]">·</span>')}
    ${resto.length ? `<span aria-hidden="true" class="text-[#8C97B3]">·</span><span class="shrink-0 font-medium text-[#3E4A68]">+${resto.length}</span>` : ''}
  </span>`;
}

function pintarTablero() {
  const entrada = gradoPintado !== S.gradoId ? 'animate-aparecer' : '';
  gradoPintado = S.gradoId;
  const g = grado();
  const lista = grupos();

  if (!pg()) {
    let cards = '';
    for (let i = 0; i < g.grupos; i++) {
      cards += `<div aria-hidden="true" style="animation-delay:${40 + i * 30}ms" class="${tarjetaBase} ${entrada} border-[1.5px] border-dashed border-[#C4D2F1] bg-white/35">
        <span class="h-[22px] w-12 rounded-lg bg-[#DCE5F8]/80 [@media(min-height:860px)]:h-6"></span>
        <span class="mt-1 h-[5px] w-full rounded-full bg-[#DCE5F8]/80 [@media(min-height:860px)]:mt-2.5 [@media(min-height:860px)]:h-1.5"></span>
        <span class="mt-1 h-[18px] w-3/4 rounded-md bg-[#DCE5F8]/60 [@media(min-height:860px)]:mt-2"></span>
      </div>`;
    }
    $('#tablero').innerHTML = `<div class="flex min-w-0 flex-1 flex-col gap-1.5 [@media(min-height:860px)]:gap-2">
      <p class="${rotuloBase} text-[#56627F]"><i data-lucide="database" class="size-3.5 shrink-0"></i>${g.grupos} grupos · sin datos en la maqueta${regla}</p>
      <div class="flex gap-2.5 [@media(min-height:860px)]:gap-3">${cards}</div></div>`;
    medirTablero();
    return;
  }

  const jornadas = [...new Set(lista.map((x) => x.jornada))];
  const conJornada = jornadas.length > 1; // la jornada va en cada tarjeta solo si el grado mezcla jornadas
  const bloques = [];
  lista.forEach((x) => {
    const b = bloques.find((k) => k.codigo === x.sede_codigo);
    if (b) b.grupos.push(x); else bloques.push({ codigo: x.sede_codigo, nombre: x.sede, grupos: [x] });
  });
  const variasSedes = bloques.length > 1;
  // Reparto por jornada: una frase si todos comparten jornada; si no, activos por jornada.
  const porJornada = jornadas.map((j) => `${j.toLowerCase()} <b class="font-semibold text-[#16223F] tabular-nums">${suma(lista.filter((x) => x.jornada === j), 'activos')}</b>`).join(' · ');
  const jornadaTxt = conJornada
    ? `<span class="min-w-0 truncate text-[#56627F]" title="Activos por jornada">${porJornada}</span>`
    : `<span class="shrink-0 text-[#56627F]">jornada de la ${jornadas[0].toLowerCase()}</span>`;
  // Con varias sedes, el resumen de jornada es de todo el grado: se rotula para no confundirlo con la última sede.
  const jornadaGrado = `<span class="min-w-0 truncate text-[#56627F]" title="Activos por jornada en todo el grado"><span class="text-[#3E4A68]">Todo el grado:</span> ${conJornada ? porJornada : jornadas[0].toLowerCase()}</span>`;
  let i = 0;

  $('#tablero').innerHTML = bloques.map((b, k) => {
    const ultimo = k === bloques.length - 1;
    let rotulo;
    if (!variasSedes) {
      rotulo = `${punto(b.codigo)}<span class="font-medium text-[#3E4A68]">Sede ${esc(b.nombre)}</span>${sepR}${jornadaTxt}${sepR}<span class="text-[#56627F]">${lista.length} grupos</span>${regla}${repartoModalidad()}`;
    } else {
      rotulo = `${punto(b.codigo)}<span class="min-w-0 truncate font-medium text-[#3E4A68]" title="${esc(b.nombre)}">${esc(sede(b.codigo).corto)}</span>${sepR}<span class="shrink-0 text-[#56627F] tabular-nums">${suma(b.grupos, 'activos')} activos</span>${regla}${ultimo ? jornadaGrado : ''}`;
    }
    const cards = b.grupos.map((x) => tarjeta(x, { conJornada, i: i++, entrada })).join('');
    return `<div class="flex min-w-0 flex-col gap-1.5 [@media(min-height:860px)]:gap-2" style="flex:${b.grupos.length} 1 0%">
      <p class="${rotuloBase}">${rotulo}</p>
      <div class="flex gap-2.5 [@media(min-height:860px)]:gap-3">${cards}</div>
    </div>`;
  }).join('');
  medirTablero();
}
// Si las tarjetas no caben (pantallas angostas), se desplazan en horizontal con un desvanecido al borde.
function medirTablero() {
  const t = $('#tablero');
  t.dataset.desborda = String(t.scrollWidth > t.clientWidth + 1);
}

/* ------------------------------------------------------------------ 4. barra de la lista: alcance, estado, filtro */
function pintarBarra() {
  const g = grado();
  const lista = grupos();
  const gr = lista.find((x) => x.id === S.grupoId);
  const variasSedes = new Set(lista.map((x) => x.sede_codigo)).size > 1;

  // Alcance: qué se está mirando (el grado o un grupo) y sus cifras.
  let titulo, cifras;
  if (!pg()) {
    titulo = `<h2 class="text-[16px] font-semibold tracking-[-0.01em] whitespace-nowrap">${esc(g.nombre)}</h2>`;
    cifras = `<b class="font-semibold text-[#16223F] tabular-nums">${g.activos}</b> activos · ${g.grupos} grupos`;
  } else {
    const alc = gr ? [gr] : lista;
    const act = suma(alc, 'activos'), cup = suma(alc, 'cupos'), nue = suma(alc, 'nuevos');
    const libres = cup - act;
    const b = (n, extra = 'text-[#16223F]') => `<b class="font-semibold ${extra} tabular-nums">${n}</b>`;
    const partes = [
      `${b(act)} de ${cup} cupos`,
      libres >= 0 ? `${b(libres)} libre${libres === 1 ? '' : 's'}` : `${b(-libres, 'text-[#B42318]')} <span class="text-[#B42318]">sobre el cupo</span>`,
      nue === 0 ? 'sin nuevos' : nue === act ? 'todos nuevos' : `<span class="inline-flex items-baseline gap-1.5"><span aria-hidden="true" class="inline-block size-2 translate-y-[-1px] rounded-[2px] bg-[#B3C4EE]" title="Tramo claro de la barra"></span>${b(nue)} nuevos</span>`,
    ];
    cifras = partes.join('<span aria-hidden="true" class="mx-1 text-[#8C97B3]">·</span>');
    titulo = gr
      ? `<button type="button" data-quitar-grupo title="Ver todo el grado" class="text-[16px] font-semibold tracking-[-0.01em] whitespace-nowrap text-[#56627F] transition hover:text-[#1E3A7B]">${esc(g.nombre)}</button>
         <i data-lucide="chevron-right" class="size-4 shrink-0 text-[#8C97B3]"></i>
         <span class="inline-flex h-8 shrink-0 items-center gap-1.5 rounded-full bg-[#EEF2FB] pr-1 pl-3 text-[14px] text-[#1E3A7B] ring-1 ring-[#D3DDF3]">
           <span class="font-semibold">${esc(gr.codigo)}</span>${variasSedes ? `<span class="text-[#3E4A68]">· ${esc(sede(gr.sede_codigo).corto)}</span>` : ''}
           <button type="button" data-quitar-grupo aria-label="Quitar el filtro de grupo y ver todo el grado" title="Ver todo el grado" class="flex size-6 items-center justify-center rounded-full hover:bg-white"><i data-lucide="x" class="size-3.5"></i></button>
         </span>`
      : `<h2 class="text-[16px] font-semibold tracking-[-0.01em] whitespace-nowrap">${esc(g.nombre)}</h2>`;
  }
  $('#alcance').innerHTML = `${titulo}<p class="min-w-0 text-[14px] text-[#56627F] md:truncate">${cifras}</p>`;

  // Estado: los conteos responden al grupo y al filtro de texto.
  const ws = palabras(S.filtro);
  const base = delAlcance().filter((e) => cumpleTexto(e, ws));
  const opciones = [['activo', 'Activos', ''], ['inactivo', 'Retirados', 'Retirados, cancelados y trasladados'], ['todos', 'Todos', '']];
  $('#estados').innerHTML = opciones.map(([clave, nombre, tit]) => {
    const n = base.filter((e) => cumpleEstado(e, clave)).length;
    const on = S.estado === clave;
    return `<button type="button" data-estado="${clave}" aria-pressed="${on}" ${tit ? `title="${tit}"` : ''}
      class="flex h-[30px] items-center gap-1.5 rounded-[9px] px-2.5 text-sm font-medium whitespace-nowrap transition ${on ? 'bg-white text-[#1E3A7B] shadow-[0_1px_3px_rgba(22,34,63,0.12)]' : 'text-[#56627F] hover:text-[#16223F]'}">
      ${nombre}<span class="tabular-nums ${on ? 'text-[#5B7BD0]' : 'text-[#6B7690]'}">${n}</span></button>`;
  }).join('');

  // Filtro de texto: X propia y "3 de 34".
  const hay = ws.length > 0;
  const total = delAlcance().filter((e) => cumpleEstado(e, S.estado)).length;
  $('#filtro-cuenta').textContent = hay ? `${visibles().length} de ${total}` : '';
  $('#filtro-limpiar').classList.toggle('hidden', !S.filtro);
  $('#filtro-limpiar').classList.toggle('flex', !!S.filtro);
  $('#filtro').classList.toggle('pr-[84px]', hay);
  $('#filtro').classList.toggle('pr-3', !hay);
}

/* ------------------------------------------------------------------ 5. tabla */
function columnas() {
  const lista = grupos(), est = estudiantes();
  return {
    sede: new Set(lista.map((g) => g.sede_codigo)).size > 1,
    jornada: new Set(lista.map((g) => g.jornada)).size > 1,
    modalidad: est.some((e) => e.modalidad),
    todosNuevos: est.length > 0 && est.every((e) => e.condicion === 'nuevo'),
  };
}

function pintarTabla() {
  const c = columnas();
  const filas = visibles();
  const f = S.filtro;
  const th = 'sticky top-0 z-10 h-[30px] border-b border-[#E3E9F6] bg-white/95 px-3 text-left align-middle text-[12px] font-semibold tracking-[0.06em] text-[#56627F] uppercase backdrop-blur [@media(min-height:860px)]:h-9';
  const td = 'h-9 border-b border-[#EEF2F9] px-3 align-middle [@media(min-height:860px)]:h-10';
  const gris = '<span class="text-[#8C97B3]">—</span>';

  // Cada columna: título, ancho, visibilidad por tamaño y cómo se pinta. Las que no distinguen nada en el grado no aparecen.
  const cols = [
    { t: '#', w: 'w-12', v: 'hidden sm:table-cell', x: 'pr-2 pl-5 text-right', f: (e, i) => `<span class="text-[13px] text-[#6B7690] tabular-nums">${i + 1}</span>` },
    { t: 'Estudiante', w: '', x: 'max-sm:pl-4', f: (e, i, el) => `<span class="block truncate font-medium ${el ? 'text-[#1E3A7B]' : e.estado !== 'activo' ? 'text-[#56627F]' : 'text-[#16223F]'}" title="${esc(e.nombre)}">${resaltar(e.nombre, f)}</span>` },
    { t: 'Documento', w: 'w-[172px]', v: 'hidden md:table-cell', f: (e) => `<span class="whitespace-nowrap text-[#3E4A68] tabular-nums"><span class="mr-1.5 text-[13px] text-[#56627F]">${esc(e.tipo_documento)}</span>${resaltar(e.numero_documento, f)}</span>` },
    { t: 'Grupo', w: 'w-[76px]', f: (e) => `<span class="font-semibold text-[#16223F] tabular-nums">${esc(e.grupo ?? '—')}</span>` },
    c.sede && { t: 'Sede', w: 'w-[148px]', v: 'hidden lg:table-cell', f: (e) => `<span class="flex min-w-0 items-center gap-2 text-[#3E4A68]" title="${esc(e.sede)}">${punto(e.sede_codigo)}<span class="truncate">${esc(sede(e.sede_codigo).corto)}</span></span>` },
    c.jornada && { t: 'Jornada', w: 'w-[92px]', v: 'hidden lg:table-cell', f: (e) => `<span class="${e.jornada === 'Tarde' ? 'font-medium text-[#8A5A0B]' : 'text-[#3E4A68]'}">${esc(e.jornada ?? '—')}</span>` },
    c.modalidad && { t: 'Modalidad', w: 'w-[140px]', v: 'hidden lg:table-cell', f: (e) => (e.modalidad ? `<span class="block truncate text-[#3E4A68]">${esc(e.modalidad)}</span>` : gris) },
    { t: 'Acudiente', w: '', v: 'hidden md:table-cell', f: (e) => (e.acudiente ? `<span class="block truncate text-[#3E4A68]" title="${esc(e.acudiente)}">${resaltar(e.acudiente, f)}</span>` : gris) },
    { t: 'Teléfono', w: 'w-[136px]', v: 'hidden sm:table-cell', f: (e) => (e.telefono
        ? `<a href="tel:${e.telefono}" data-tel class="whitespace-nowrap text-[#3E4A68] tabular-nums decoration-[#8C97B3] underline-offset-4 hover:text-[#1E3A7B] hover:underline">${telefono(e.telefono)}</a>`
        : gris) },
    { t: 'Situación', w: 'w-[104px] sm:w-[120px]', x: 'pr-4 sm:pr-5', f: (e) => {
        if (e.estado !== 'activo') return marca(e.estado);
        if (e.condicion === 'repitente') return marca('repitente');
        if (e.condicion === 'nuevo' && !c.todosNuevos) return marca('nuevo');
        return '';
      } },
  ].filter(Boolean);

  $('#encabezado').innerHTML = `<tr>${cols.map((k) => `<th scope="col" class="${th} ${k.w} ${k.v ?? ''} ${k.x ?? ''}">${k.t === '#' ? '<span class="sr-only">Número de lista</span>#' : k.t}</th>`).join('')}</tr>`;

  $('#filas').innerHTML = filas.map((e, i) => {
    const el = e.id === S.sel;
    const bg = el ? 'bg-[#EEF2FB]' : 'group-hover:bg-[#F7F9FD]';
    return `<tr data-id="${e.id}" tabindex="${el ? 0 : -1}" aria-selected="${el}" class="group cursor-pointer scroll-mt-[30px] outline-none [@media(min-height:860px)]:scroll-mt-9">
      ${cols.map((k, j) => `<td class="${td} ${bg} ${k.v ?? ''} ${k.x ?? ''} ${j === 0 && el ? 'shadow-[inset_3px_0_0_#1E3A7B]' : ''}">${k.f(e, i, el)}</td>`).join('')}
    </tr>`;
  }).join('');

  const vacio = $('#vacio');
  if (!pg()) {
    const g = grado();
    vacio.className = 'flex flex-col items-center justify-center gap-3 px-6 py-12 text-center';
    vacio.innerHTML = `<span class="flex size-12 items-center justify-center rounded-2xl bg-[#EEF2FB] text-[#5B7BD0]"><i data-lucide="database" class="size-5"></i></span>
      <p class="text-[16px] font-semibold">${esc(g.nombre)}: sin datos en la maqueta</p>
      <p class="max-w-md text-sm text-[#56627F]">En el sistema real aquí verías sus ${g.activos} estudiantes activos en ${g.grupos} grupos. La maqueta solo trae datos de Transición y Décimo.</p>
      <div class="mt-1 flex gap-2">
        <button type="button" data-ir-grado="1" class="h-9 rounded-[12px] border-[1.5px] border-[#D3DDF3] px-4 text-sm font-medium text-[#1E3A7B] hover:border-[#1E3A7B]">Ver Transición</button>
        <button type="button" data-ir-grado="11" class="h-9 rounded-[12px] bg-[#1E3A7B] px-4 text-sm font-medium text-white hover:bg-[#172E63]">Ver Décimo</button>
      </div>`;
  } else if (filas.length === 0) {
    vacio.className = 'flex flex-col items-center justify-center gap-2 px-6 py-12 text-center';
    vacio.innerHTML = `<p class="text-[15px] font-semibold">Nadie coincide con los filtros</p>
      <p class="text-sm text-[#56627F]">${S.filtro ? `No hay resultados para «${esc(S.filtro)}» en esta vista.` : 'Prueba con otro estado o grupo.'}</p>
      <button type="button" data-limpiar-filtros class="mt-2 h-9 rounded-[12px] border-[1.5px] border-[#D3DDF3] px-4 text-sm font-medium text-[#1E3A7B] hover:border-[#1E3A7B]">Quitar filtros</button>`;
  } else {
    vacio.className = 'hidden';
    vacio.innerHTML = '';
  }
}

/* ------------------------------------------------------------------ 6. ficha */
function bloque(titulo, cuerpo) {
  return `<section class="border-t border-[#EEF2F9] px-5 py-3.5 first:border-t-0 [@media(min-height:860px)]:py-4">
    <h3 class="mb-2.5 text-[12px] font-semibold tracking-[0.08em] text-[#6B7690] uppercase">${titulo}</h3>${cuerpo}</section>`;
}

function pintarFicha() {
  const f = D.fichas[String(S.sel)];
  if (!f) return;
  const { estudiante: e, actual: m, historia, acudientes } = f;
  const lista = visibles();
  const pos = lista.findIndex((x) => x.id === S.sel);
  const años = edad(e.fecha_nacimiento);
  const retirado = m && m.estado !== 'activo';
  const sep = '<span aria-hidden="true" class="text-[#8C97B3]">·</span>';

  const acud = acudientes.length === 0 ? '<p class="text-sm text-[#56627F]">Sin acudiente registrado</p>' :
    `<div class="space-y-2">${[...acudientes].sort((a, b) => b.es_principal - a.es_principal).map((a) => {
      const tels = [[a.telefono_celular, 'smartphone', 'Celular'], [a.telefono_fijo, 'phone', 'Fijo']].filter(([t]) => t);
      return `<div class="rounded-[16px] bg-[#F5F7FC] px-3.5 py-3">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-[15px] leading-snug font-semibold text-[#16223F]">${esc(a.nombre)}</p>
            <p class="text-[13px] text-[#56627F]">${esc(a.parentesco)} · ${esc(a.tipo_documento)} ${esc(a.numero_documento)}</p>
          </div>
          ${a.es_principal ? '<span class="shrink-0 rounded-full bg-white px-2.5 py-0.5 text-[12px] font-medium text-[#1E3A7B] ring-1 ring-[#D3DDF3]">Principal</span>' : ''}
        </div>
        ${tels.length || a.email ? `<div class="mt-2 flex flex-wrap gap-1.5">
          ${tels.map(([t, ic, et]) => `<a href="tel:${t}" title="${et}" class="inline-flex h-8 items-center gap-1.5 rounded-full bg-white px-3 text-[14px] font-semibold text-[#1E3A7B] tabular-nums ring-1 ring-[#DCE5F8] transition hover:ring-[#1E3A7B]"><i data-lucide="${ic}" class="size-3.5"></i>${telefono(t)}</a>`).join('')}
          ${a.email ? `<a href="mailto:${esc(a.email)}" class="inline-flex h-8 max-w-full min-w-0 items-center gap-1.5 rounded-full bg-white px-3 text-[13px] font-medium text-[#1E3A7B] ring-1 ring-[#DCE5F8] transition hover:ring-[#1E3A7B]"><i data-lucide="mail" class="size-3.5 shrink-0"></i><span class="truncate">${esc(a.email)}</span></a>` : ''}
        </div>` : '<p class="mt-1.5 text-[13px] text-[#56627F]">Sin teléfono ni correo</p>'}
        ${a.direccion || a.barrio ? `<p class="mt-2 flex items-start gap-1.5 text-[13px] text-[#56627F]"><i data-lucide="map-pin" class="mt-0.5 size-3.5 shrink-0"></i>${esc([a.direccion, a.barrio].filter(Boolean).join(' · '))}</p>` : ''}
      </div>`;
    }).join('')}</div>`;

  // Matrícula en dos líneas: lo que ubica y las fechas.
  const matricula = m ? `<p class="flex flex-wrap items-center gap-x-2 gap-y-1 text-[14px] text-[#16223F]">
      <span>${esc(m.grado)}</span>${sep}<b class="font-semibold">${esc(m.grupo ?? '—')}</b>${sep}
      <span class="inline-flex items-center gap-1.5">${punto(m.sede_codigo)}${esc(m.sede)}</span>${sep}<span>${esc(m.jornada)}</span>
      ${m.modalidad ? `${sep}<span>${esc(m.modalidad)}</span>` : ''}
    </p>
    <p class="mt-1 text-[14px] text-[#56627F]">Matriculado el ${esc(fecha(m.fecha_matricula) ?? '—')} ${sep} Nació el ${esc(fecha(e.fecha_nacimiento) ?? '—')}</p>` : '';

  // La sede solo se repite en la historia si el estudiante ha pasado por más de una.
  const variasSedesHist = new Set(historia.map((h) => h.sede_codigo)).size > 1;
  const hist = `${variasSedesHist ? '' : `<p class="-mt-1 mb-2.5 flex items-center gap-1.5 text-[13px] text-[#56627F]">${punto(historia[0]?.sede_codigo)}Siempre en la sede ${esc(historia[0]?.sede ?? '')}</p>`}
    <ol class="relative">${historia.map((h, i) => {
    const ultimo = i === historia.length - 1;
    const notas = [];
    if (h.condicion === 'repitente') notas.push('<span class="text-[#8A5A0B]">repitió</span>');
    if (h.estado !== 'activo') notas.push(`<span class="text-[#A12B2B]">${esc(SITUACION[h.estado]?.texto.toLowerCase() ?? h.estado)}</span>`);
    return `<li class="relative flex gap-3.5 ${ultimo ? '' : 'pb-2.5'}">
      ${ultimo ? '' : '<span aria-hidden="true" class="absolute top-[18px] bottom-0.5 left-1 w-0.5 rounded-full bg-[#DCE5F8]"></span>'}
      <span aria-hidden="true" class="relative mt-[5px] size-2.5 shrink-0 rounded-full ${i === 0 ? 'bg-[#1E3A7B]' : 'bg-white ring-2 ring-[#B7C6EA] ring-inset'}"></span>
      <div class="flex min-w-0 flex-1 items-baseline gap-3 text-[14px]">
        <span class="w-10 shrink-0 font-semibold tabular-nums ${i === 0 ? 'text-[#1E3A7B]' : 'text-[#16223F]'}">${h.anio}</span>
        <span class="min-w-0 flex-1 truncate text-[#3E4A68]">${esc(h.grado)} · <b class="font-semibold text-[#16223F]">${esc(h.grupo ?? '—')}</b>${notas.length ? ` · ${notas.join(' · ')}` : ''}</span>
        ${variasSedesHist ? `<span class="flex shrink-0 items-center gap-1.5 text-[13px] text-[#56627F]" title="${esc(h.sede)}">${punto(h.sede_codigo)}${esc(sede(h.sede_codigo).corto)}</span>` : ''}
      </div>
    </li>`;
  }).join('')}</ol>`;

  const botonMover = (paso, icono, etq, off) => `<button type="button" data-mover="${paso}" aria-label="${etq}" title="${etq} (${paso < 0 ? '↑' : '↓'})" ${off ? 'disabled' : ''} class="flex size-10 shrink-0 items-center justify-center rounded-[13px] bg-white/85 text-[#1E3A7B] shadow-[0_1px_2px_rgba(22,34,63,0.06)] transition hover:bg-white disabled:opacity-40"><i data-lucide="${icono}" class="size-5"></i></button>`;

  $('#ficha-cuerpo').innerHTML = `
    <div class="relative shrink-0 overflow-hidden bg-gradient-to-br from-[#EEF2FB] to-[#DCE5F8] px-5 pt-3.5 pb-3.5">
      <div aria-hidden="true" class="pointer-events-none absolute -top-20 -right-16 size-56 rounded-full bg-white/70 blur-3xl"></div>
      <button type="button" data-cerrar aria-label="Cerrar ficha (Esc)" title="Cerrar (Esc)" class="absolute top-3 right-3 flex size-8 items-center justify-center rounded-full bg-white/70 text-[#3E4A68] transition hover:bg-white hover:text-[#16223F]"><i data-lucide="x" class="size-4"></i></button>

      <div class="relative flex items-start gap-3.5 pr-8">
        <span class="flex size-12 shrink-0 items-center justify-center rounded-[15px] bg-[#1E3A7B] text-[16px] font-semibold text-white shadow-[0_10px_20px_-10px_rgba(30,58,123,0.7)]">${iniciales(e.nombre_completo)}</span>
        <div class="min-w-0">
          <h2 class="text-[19px] leading-[1.2] font-semibold tracking-[-0.02em] text-balance">${esc(e.nombre_completo)}</h2>
          <p class="mt-0.5 text-[14px] text-[#3E4A68] tabular-nums">${esc(e.tipo_documento)} ${esc(e.numero_documento)}${años !== null ? ` · ${años} años` : ''}</p>
          ${m ? `<p class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-[13px]"><span class="font-semibold text-[#1E3A7B] tabular-nums">${esc(m.grupo ?? m.grado)} · ${m.anio}</span>${marca(m.condicion)}${marca(m.estado)}</p>` : ''}
        </div>
      </div>

      <div class="relative mt-3 flex items-center gap-2">
        <a href="/estudiantes/${e.id}" class="group/btn flex h-10 min-w-0 flex-1 items-center justify-center gap-2 rounded-[13px] bg-[#1E3A7B] px-3 text-[14px] font-semibold whitespace-nowrap text-white shadow-[0_12px_24px_-12px_rgba(30,58,123,0.6)] transition hover:bg-[#172E63] focus-visible:ring-4 focus-visible:ring-[#B7C6EA] focus-visible:outline-none active:scale-[0.99]">
          <i data-lucide="file-text" class="size-[18px] shrink-0 transition-transform group-hover/btn:-translate-y-px"></i><span class="truncate">Ficha completa e impresión</span>
        </a>
        <span class="shrink-0 px-1 text-[13px] whitespace-nowrap text-[#56627F] tabular-nums" title="Posición en la lista">${pos >= 0 ? `${pos + 1} de ${lista.length}` : '—'}</span>
        ${botonMover(-1, 'chevron-up', 'Estudiante anterior', pos <= 0)}
        ${botonMover(1, 'chevron-down', 'Estudiante siguiente', pos < 0 || pos >= lista.length - 1)}
      </div>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain [scrollbar-color:#C4D2F1_transparent] [scrollbar-width:thin]">
      ${retirado && (m.fecha_retiro || m.motivo_retiro) ? `<div class="mx-5 mt-3.5 flex items-start gap-3 rounded-[16px] bg-[#FDECEC] px-4 py-3 text-[14px] text-[#8E2323]">
        <i data-lucide="circle-alert" class="mt-0.5 size-[18px] shrink-0"></i>
        <p><b class="font-semibold">${esc(SITUACION[m.estado]?.texto ?? m.estado)}${m.fecha_retiro ? ` el ${fecha(m.fecha_retiro)}` : ''}</b>${m.motivo_retiro ? `<br><span class="text-[#A12B2B]">${esc(m.motivo_retiro)}</span>` : ''}</p>
      </div>` : ''}
      <div>
        ${bloque(acudientes.length > 1 ? `Acudientes · ${acudientes.length}` : 'Acudiente', acud)}
        ${m ? bloque(`Matrícula ${m.anio}`, matricula) : ''}
        ${historia.length ? bloque('Historia en el colegio', hist) : ''}
        ${m?.observaciones ? bloque('Observaciones', `<p class="flex items-start gap-2.5 rounded-[16px] bg-[#FFF7E8] px-4 py-3 text-[14px] leading-relaxed text-[#6B4A0E]"><i data-lucide="sticky-note" class="mt-0.5 size-4 shrink-0 text-[#B7862C]"></i><span class="whitespace-pre-line">${esc(m.observaciones)}</span></p>`) : ''}
      </div>
      <p class="px-5 pt-1 pb-5 text-[12px] text-[#6B7690]">Con <kbd class="rounded border border-[#E3E9F6] bg-[#F5F7FC] px-1 font-sans">↑</kbd> <kbd class="rounded border border-[#E3E9F6] bg-[#F5F7FC] px-1 font-sans">↓</kbd> recorres la lista sin cerrar la ficha · <kbd class="rounded border border-[#E3E9F6] bg-[#F5F7FC] px-1 font-sans">Esc</kbd> la cierra</p>
    </div>`;
}

function abrirFicha() {
  if (S.sel === null) return;
  S.abierta = true;
  pintarFicha();
  $('#ficha').dataset.abierta = 'true';
  $('#velo').classList.remove('opacity-0');
  iconos();
  // Al acoplarse (2xl) la lista se angosta: la fila elegida sigue a la vista.
  if (esAncha()) setTimeout(() => $(`tr[data-id="${S.sel}"]`)?.scrollIntoView({ block: 'nearest' }), 320);
}
function cerrarFicha() {
  S.abierta = false;
  $('#ficha').dataset.abierta = 'false';
  $('#velo').classList.add('opacity-0');
  $(`tr[data-id="${S.sel}"]`)?.focus({ preventScroll: true });
}

/* ------------------------------------------------------------------ búsqueda global */
function todosLosEstudiantes() {
  return Object.values(D.porGrado).flatMap((p) => p.estudiantes.map((e) => ({ ...e, gradoId: p.gradoId })));
}
function buscar() {
  const ws = palabras(S.q);
  const q = plano(S.q.trim());
  if (q.length < 2) { S.res = []; return; }
  S.res = todosLosEstudiantes()
    .filter((e) => { const n = plano(e.nombre); return ws.every((p) => n.includes(p)) || e.numero_documento.includes(q); })
    .slice(0, 8);
  S.resI = 0;
}
function pintarBusqueda() {
  const caja = $('#resultados');
  const hay = S.q.trim().length >= 2;
  $('#atajo').classList.toggle('hidden', !!S.q);
  $('#limpiar-busqueda').classList.toggle('hidden', !S.q);
  $('#limpiar-busqueda').classList.toggle('flex', !!S.q);
  if (!hay) { caja.classList.add('hidden'); return; }
  caja.classList.remove('hidden');
  if (S.res.length === 0) {
    caja.innerHTML = `<p class="px-4 py-4 text-sm text-[#56627F]">Sin resultados para «${esc(S.q)}».</p>`;
    return;
  }
  const nombreGrado = (id) => D.grados.find((g) => g.id === id)?.nombre ?? '';
  caja.innerHTML = `<ul class="max-h-[360px] overflow-y-auto p-1.5">${S.res.map((r, i) => `
    <li role="option" aria-selected="${i === S.resI}" data-res="${i}"
      class="flex cursor-pointer items-center gap-3 rounded-[12px] px-3 py-2 ${i === S.resI ? 'bg-[#EEF2FB]' : 'hover:bg-[#F5F7FC]'}">
      <span class="flex size-9 shrink-0 items-center justify-center rounded-full ${i === S.resI ? 'bg-[#1E3A7B] text-white' : 'bg-[#EEF2FB] text-[#1E3A7B]'} text-[13px] font-semibold">${iniciales(r.nombre)}</span>
      <span class="min-w-0 flex-1">
        <span class="block truncate text-[14px] text-[#16223F]">${resaltar(r.nombre, S.q)}</span>
        <span class="block text-[13px] text-[#56627F] tabular-nums">${esc(r.tipo_documento)} ${resaltar(r.numero_documento, S.q)}</span>
      </span>
      <span class="flex shrink-0 flex-col items-end text-[13px]">
        <span class="font-semibold text-[#1E3A7B]">${esc(r.grupo ?? '—')}</span>
        ${r.estado !== 'activo' ? marca(r.estado) : `<span class="text-[#56627F]">${esc(nombreGrado(r.gradoId))}</span>`}
      </span>
    </li>`).join('')}</ul>
    <p class="flex items-center gap-3 border-t border-[#EEF2F9] bg-[#FAFBFE] px-4 py-2 text-[12px] text-[#56627F]"><span><kbd class="font-sans">↑ ↓</kbd> moverse</span><span><kbd class="font-sans">Enter</kbd> abrir ficha</span><span><kbd class="font-sans">Esc</kbd> cerrar</span></p>`;
}
function cerrarBusqueda(limpiar = true) {
  if (limpiar) { S.q = ''; $('#busqueda').value = ''; }
  S.res = [];
  pintarBusqueda();
}
function elegirResultado(i) {
  const r = S.res[i];
  if (!r) return;
  cerrarBusqueda();
  $('#busqueda').blur();
  if (S.gradoId !== r.gradoId) { S.gradoId = r.gradoId; S.grupoId = null; }
  if (S.grupoId !== null && S.grupoId !== r.grupo_id) S.grupoId = null;
  if (!cumpleEstado(r, S.estado)) S.estado = 'todos';
  S.filtro = ''; $('#filtro').value = '';
  S.sel = r.id;
  pintarTodo();
  enfocarFila(true);
  abrirFicha();
}

/* ------------------------------------------------------------------ selección y teclado */
function enfocarFila(centrar = false) {
  const fila = $(`tr[data-id="${S.sel}"]`);
  if (!fila) return;
  fila.scrollIntoView({ block: centrar ? 'center' : 'nearest' });
  if (!S.abierta && document.activeElement?.id !== 'filtro') fila.focus({ preventScroll: true });
}
function seleccionar(id, { abrir = false } = {}) {
  S.sel = id;
  pintarTabla();
  enfocarFila();
  if (abrir && !S.abierta) abrirFicha();
  else if (S.abierta) { pintarFicha(); iconos(); }
  else iconos();
}
function mover(paso) {
  const lista = visibles();
  if (!lista.length) return;
  const i = lista.findIndex((x) => x.id === S.sel);
  const j = i < 0 ? 0 : Math.min(Math.max(i + paso, 0), lista.length - 1);
  seleccionar(lista[j].id);
}

/* ------------------------------------------------------------------ aviso */
let temporizador;
function avisar(texto) {
  const a = $('#aviso');
  a.innerHTML = `<i data-lucide="info" class="size-4 text-[#9DB3EA]"></i>${esc(texto)}`;
  iconos();
  a.classList.remove('opacity-0', 'translate-y-3');
  clearTimeout(temporizador);
  temporizador = setTimeout(ocultarAviso, 3200);
}
function ocultarAviso() { $('#aviso').classList.add('opacity-0', 'translate-y-3'); }

/* ------------------------------------------------------------------ pintar */
function iconos() { lucide.createIcons(); }
function pintarLista() { pintarBarra(); pintarTabla(); if (S.abierta) pintarFicha(); iconos(); }
function pintarTodo() {
  pintarGrados();
  pintarTablero();
  pintarLista();
}
function cambiarGrado(id) {
  if (id === S.gradoId) return;
  S.gradoId = id; S.grupoId = null; S.filtro = ''; $('#filtro').value = '';
  if (S.abierta) cerrarFicha();
  S.sel = null;
  pintarTodo();
  $('#lista').scrollTop = 0;
}
function elegirGrupo(id) {
  S.grupoId = id;
  pintarTablero(); pintarLista();
  $('#lista').scrollTop = 0;
}

/* ------------------------------------------------------------------ eventos */
function eventos() {
  $('#grados').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-grado]');
    if (b) cambiarGrado(Number(b.dataset.grado));
  });
  $('#tablero').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-grupo]');
    if (!b) return;
    const v = Number(b.dataset.grupo);
    elegirGrupo(v === S.grupoId ? null : v);
  });
  $('#alcance').addEventListener('click', (ev) => {
    if (ev.target.closest('[data-quitar-grupo]')) elegirGrupo(null);
  });
  $('#estados').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-estado]');
    if (!b) return;
    S.estado = b.dataset.estado;
    pintarLista();
    $('#lista').scrollTop = 0;
  });
  const filtro = $('#filtro');
  filtro.addEventListener('input', () => {
    S.filtro = filtro.value;
    pintarLista();
    $('#lista').scrollTop = 0;
  });
  $('#filtro-limpiar').addEventListener('click', () => { S.filtro = ''; filtro.value = ''; pintarLista(); filtro.focus(); });
  $('#lista').addEventListener('click', (ev) => {
    if (ev.target.closest('[data-tel]')) return;
    const ir = ev.target.closest('[data-ir-grado]');
    if (ir) { cambiarGrado(Number(ir.dataset.irGrado)); return; }
    if (ev.target.closest('[data-limpiar-filtros]')) {
      S.filtro = ''; filtro.value = ''; S.grupoId = null; S.estado = 'activo';
      pintarTodo(); return;
    }
    const fila = ev.target.closest('tr[data-id]');
    if (fila) seleccionar(Number(fila.dataset.id), { abrir: true });
  });
  $('#ficha').addEventListener('click', (ev) => {
    if (ev.target.closest('[data-cerrar]')) cerrarFicha();
    const m = ev.target.closest('[data-mover]');
    if (m) mover(Number(m.dataset.mover));
  });
  $('#anio').addEventListener('change', (ev) => {
    const v = Number(ev.target.value);
    if (v !== D.anio) {
      avisar(`Año ${v}: sin datos en la maqueta. Se muestra ${D.anio}.`);
      ev.target.value = D.anio;
    }
  });

  const caja = $('#busqueda');
  caja.addEventListener('input', () => { S.q = caja.value; buscar(); pintarBusqueda(); });
  caja.addEventListener('focus', () => { if (S.q) { buscar(); pintarBusqueda(); } });
  $('#limpiar-busqueda').addEventListener('click', () => { cerrarBusqueda(); caja.focus(); });
  $('#resultados').addEventListener('mousedown', (ev) => {
    const li = ev.target.closest('[data-res]');
    if (li) { ev.preventDefault(); elegirResultado(Number(li.dataset.res)); }
  });
  $('#resultados').addEventListener('mousemove', (ev) => {
    const li = ev.target.closest('[data-res]');
    if (li && Number(li.dataset.res) !== S.resI) { S.resI = Number(li.dataset.res); pintarBusqueda(); }
  });

  // Panel flotante: pulsar fuera lo cierra (otra fila cambia de estudiante; la búsqueda no lo cierra).
  // Acoplado (2xl) es una columna más: no se cierra al pulsar fuera.
  document.addEventListener('mousedown', (ev) => {
    const t = ev.target;
    if (!t.closest('#busqueda-wrap') && S.q) cerrarBusqueda(false);
    if (S.abierta && !esAncha() && !t.closest('#ficha, tr[data-id], header, #busqueda-wrap')) cerrarFicha();
  });

  document.addEventListener('keydown', (ev) => {
    const t = ev.target;
    const enCampo = t.matches('input, select, textarea');

    if (ev.key === 'Escape') {
      if (S.q || S.res.length) { cerrarBusqueda(); ev.preventDefault(); return; }
      if (S.abierta) { cerrarFicha(); ev.preventDefault(); return; }
      if (t.id === 'filtro' && S.filtro) { S.filtro = ''; t.value = ''; pintarLista(); return; }
      ocultarAviso();
      if (enCampo) t.blur();
      return;
    }
    if (t === caja) {
      if (!S.res.length) return;
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        S.resI = (S.resI + (ev.key === 'ArrowDown' ? 1 : -1) + S.res.length) % S.res.length;
        pintarBusqueda();
      } else if (ev.key === 'Enter') { ev.preventDefault(); elegirResultado(S.resI); }
      return;
    }
    // "/" lleva a la búsqueda global (la ficha ya no la tapa).
    if (ev.key === '/' && !enCampo) { ev.preventDefault(); caja.focus(); return; }
    if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && (!enCampo || t.id === 'filtro')) {
      ev.preventDefault();
      mover(ev.key === 'ArrowDown' ? 1 : -1);
      return;
    }
    if (ev.key === 'Enter' && S.sel !== null && (t.id === 'filtro' || (!enCampo && !t.closest('#ficha') && !t.matches('button, a')))) {
      ev.preventDefault();
      abrirFicha();
    }
  });
  addEventListener('resize', medirTablero);
}

/* ------------------------------------------------------------------ arranque */
fetch('datos.json')
  .then((r) => r.json())
  .then((datos) => {
    D = datos;
    if (!D.grados.some((g) => g.id === S.gradoId)) S.gradoId = 11;
    pintarCabecera();
    pintarTodo();
    pintarBusqueda();
    eventos();
    if (params.get('ver')) {
      const v = estudiantes().find((x) => x.id === Number(params.get('ver')));
      if (v) { if (!cumpleEstado(v, S.estado)) S.estado = 'todos'; S.sel = v.id; pintarTodo(); enfocarFila(true); abrirFicha(); }
    }
  });
</script>
