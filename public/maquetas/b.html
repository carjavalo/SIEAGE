<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudiantes · SIEAGE</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=outfit:400,500,600,700" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<!-- Solo animaciones (en la app las da tailwindcss-animate: animate-in fade-in slide-in-from-bottom-2). -->
<style>
  @keyframes aparecer { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fundido { from { opacity: 0; } to { opacity: 1; } }
  @keyframes avivar { from { opacity: .6; } to { opacity: 1; } }
  @keyframes emerger { from { opacity: 0; transform: translateY(-6px) scale(.985); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="bg-[#F5F7FC]">
<div class="min-h-screen bg-[#F5F7FC] font-['Outfit',ui-sans-serif,system-ui,sans-serif] text-[#16223F] antialiased">

  <!-- ============================================ encabezado global (panel-layout.tsx) -->
  <header class="sticky top-0 z-30 border-b border-[#E3E9F6] bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-[1400px] items-center gap-6 px-4 md:px-8">
      <a href="/estudiantes" class="flex shrink-0 items-center gap-3">
        <img src="/sieage-logo.png" alt="SIEAGE" class="h-10 w-auto rounded-md object-contain">
        <div class="hidden leading-tight sm:block">
          <p class="text-[15px] font-semibold tracking-tight">SIEAGE</p>
          <p class="text-xs text-[#56627F]">I.E. Alfonso López Pumarejo</p>
        </div>
      </a>
      <nav class="flex items-center gap-1 rounded-full bg-[#EEF2FB] p-1">
        <a href="/estudiantes" class="flex items-center gap-2 rounded-full bg-white px-3.5 py-2 text-sm font-medium text-[#1E3A7B] shadow-sm transition">
          <i data-lucide="graduation-cap" class="size-4"></i><span class="hidden md:inline">Estudiantes</span>
        </a>
        <a href="/dashboard" class="flex items-center gap-2 rounded-full px-3.5 py-2 text-sm font-medium text-[#56627F] transition hover:text-[#1E3A7B]">
          <i data-lucide="upload-cloud" class="size-4"></i><span class="hidden md:inline">Importar datos</span>
        </a>
      </nav>
      <div class="ml-auto">
        <button type="button" class="flex items-center gap-2 rounded-full p-1 pr-3 text-sm transition-colors hover:bg-[#EEF2FB]">
          <span class="flex h-8 w-8 items-center justify-center overflow-hidden rounded-full bg-neutral-200 text-black">A</span>
          <span class="grid flex-1 text-left text-sm leading-tight"><span class="truncate font-medium">Administrador</span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1400px] px-4 py-6 md:px-8 lg:flex lg:h-[calc(100dvh-4rem-1px)] lg:flex-col lg:py-5">

    <!-- ============================================ barra: misma rejilla que las dos zonas de abajo -->
    <div class="relative z-20 flex shrink-0 flex-wrap items-center gap-x-6 gap-y-3 animate-[aparecer_.5s_ease-out_both] motion-reduce:animate-none xl:grid xl:grid-cols-[440px_minmax(0,1fr)] 2xl:grid-cols-[480px_minmax(0,1fr)]">
      <!-- grado: parece un control todo el tiempo -->
      <div class="relative min-w-0">
        <h1 class="flex">
          <button id="btn-grado" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Cambiar de grado"
            class="group flex h-11 items-center gap-2.5 rounded-[14px] bg-white pr-3 pl-1.5 shadow-[0_1px_2px_rgba(22,34,63,0.05)] ring-1 ring-[#E3E9F6] transition hover:ring-[#C4D2F1] focus-visible:ring-4 focus-visible:ring-[#DCE5F8] focus-visible:outline-none aria-expanded:ring-2 aria-expanded:ring-[#9DB2E6]">
            <span id="grado-corto" class="flex h-8 min-w-8 items-center justify-center rounded-[10px] bg-[#1E3A7B] px-1.5 text-[14px] font-semibold text-white tabular-nums">10°</span>
            <span id="titulo-grado" class="text-[24px] leading-8 font-semibold tracking-[-0.02em]">Grado</span>
            <i data-lucide="chevron-down" class="size-5 text-[#8C97B3] transition group-hover:text-[#1E3A7B] group-aria-expanded:rotate-180"></i>
          </button>
        </h1>
        <div id="menu-grado" class="absolute top-full left-0 z-40 mt-2 hidden"></div>
      </div>

      <!-- año · totales del colegio (pegados al borde de la ficha) · búsqueda global -->
      <div class="flex w-full min-w-0 items-center gap-4 lg:w-auto lg:flex-1 xl:w-auto">
        <div class="relative flex min-w-0 items-center gap-4">
          <button id="btn-anio" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Año lectivo"
            class="flex h-11 shrink-0 items-center gap-2 rounded-full bg-white pr-3 pl-3.5 text-[15px] font-semibold tabular-nums shadow-[0_1px_2px_rgba(22,34,63,0.05)] ring-1 ring-[#E3E9F6] transition hover:ring-[#C4D2F1] focus-visible:ring-4 focus-visible:ring-[#DCE5F8] focus-visible:outline-none aria-expanded:ring-2 aria-expanded:ring-[#9DB2E6]">
            <i data-lucide="calendar-days" class="size-4 text-[#5B7BD0]"></i><span id="anio-actual">2026</span>
            <i data-lucide="chevron-down" class="size-4 text-[#8C97B3]"></i>
          </button>
          <p id="totales" class="hidden items-center gap-3 text-[14px] whitespace-nowrap text-[#56627F] xl:flex"></p>
          <div id="menu-anio" class="absolute top-full left-0 z-40 mt-2 hidden"></div>
        </div>

        <div id="caja-busqueda" class="relative min-w-0 flex-1 lg:ml-auto lg:w-[300px] lg:flex-none 2xl:w-[320px]">
          <i data-lucide="search" class="pointer-events-none absolute top-1/2 left-4 size-[18px] -translate-y-1/2 text-[#8C97B3]"></i>
          <input id="busqueda" type="search" autocomplete="off" spellcheck="false"
            placeholder="Buscar en todo el colegio"
            aria-label="Buscar estudiante en todo el colegio por nombre o documento" aria-controls="resultados" aria-expanded="false"
            class="h-11 w-full rounded-[14px] border-[1.5px] border-[#D3DDF3] bg-white pr-11 pl-11 text-[15px] text-[#16223F] outline-none transition placeholder:text-[#8C97B3] hover:border-[#B7C6EA] focus:border-[#6E8BD6] focus:ring-4 focus:ring-[#DCE5F8] [&::-webkit-search-cancel-button]:hidden">
          <kbd id="atajo-busqueda" class="pointer-events-none absolute max-lg:!hidden top-1/2 right-3 flex h-6 min-w-6 -translate-y-1/2 items-center justify-center rounded-[7px] bg-[#EEF2FB] px-1.5 font-sans text-[13px] font-medium text-[#56627F]">/</kbd>
          <button id="limpiar-busqueda" type="button" aria-label="Limpiar búsqueda"
            class="absolute top-1/2 right-2 hidden size-8 -translate-y-1/2 items-center justify-center rounded-[10px] text-[#5F6B88] transition hover:bg-[#EEF2FB] hover:text-[#16223F]">
            <i data-lucide="x" class="size-4"></i>
          </button>
          <div id="resultados" class="absolute top-[calc(100%+8px)] right-0 z-40 hidden w-[480px] max-w-[calc(100vw-32px)]"></div>
        </div>
      </div>
    </div>

    <!-- ============================================ dos zonas: lista · ficha -->
    <div class="mt-4 grid gap-6 lg:min-h-0 lg:flex-1 xl:grid-cols-[440px_minmax(0,1fr)] 2xl:grid-cols-[480px_minmax(0,1fr)]">

      <!-- ---------------- lista (sin caja: directamente sobre el fondo) -->
      <section aria-label="Lista de estudiantes" class="flex min-h-0 min-w-0 flex-col animate-[aparecer_.5s_.08s_ease-out_both] motion-reduce:animate-none">
        <div id="chips" class="flex shrink-0 flex-wrap items-end gap-1" role="group" aria-label="Grupos"></div>

        <div id="resumen" class="mt-2.5 shrink-0 px-1"></div>

        <div class="mt-3 flex shrink-0 flex-wrap items-center gap-2 [@media(max-height:720px)]:mt-2.5">
          <div id="estados" class="flex shrink-0 rounded-[13px] bg-[#E8EDF7] p-1" role="group" aria-label="Estado"></div>
          <div class="relative min-w-[140px] flex-1">
            <i data-lucide="list-filter" class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-[#8C97B3]"></i>
            <input id="filtro" type="search" autocomplete="off" spellcheck="false" placeholder="Filtrar esta lista" aria-label="Filtrar esta lista por nombre o documento"
              class="h-10 w-full rounded-[13px] bg-white pr-9 pl-9 text-[14px] placeholder-shown:pr-2 shadow-[0_1px_2px_rgba(22,34,63,0.05)] ring-1 ring-[#E3E9F6] outline-none transition placeholder:text-[#8C97B3] hover:ring-[#C4D2F1] focus:ring-2 focus:ring-[#9DB2E6] [&::-webkit-search-cancel-button]:hidden">
            <button id="limpiar-filtro-x" type="button" aria-label="Limpiar filtro"
              class="absolute top-1/2 right-1.5 hidden size-7 -translate-y-1/2 items-center justify-center rounded-[9px] text-[#5F6B88] transition hover:bg-[#EEF2FB] hover:text-[#16223F]">
              <i data-lucide="x" class="size-4"></i>
            </button>
          </div>
        </div>

        <div id="lista" role="listbox" aria-label="Estudiantes" tabindex="-1"
          class="mt-2 -mr-2 max-h-[70vh] min-h-0 flex-1 overflow-y-auto overscroll-contain border-t border-[#E3E9F6] pr-2 pb-2 [scrollbar-color:#C4D2F1_transparent] [scrollbar-width:thin] lg:max-h-none"></div>
      </section>

      <!-- ---------------- ficha: siempre muestra a alguien; mide lo que su contenido (el sobrante es fondo, no un hueco en la hoja) -->
      <article id="ficha" aria-label="Ficha del estudiante" aria-live="polite"
        class="@container hidden min-h-0 flex-col overflow-hidden rounded-[28px] bg-white shadow-[0_1px_2px_rgba(22,34,63,0.04),0_28px_56px_-32px_rgba(22,34,63,0.22)] ring-1 ring-[#E3E9F6]/80 animate-[aparecer_.55s_.16s_ease-out_both] motion-reduce:animate-none xl:flex xl:max-h-full xl:self-start max-xl:data-abierta:fixed max-xl:data-abierta:inset-y-3 max-xl:data-abierta:right-3 max-xl:data-abierta:z-50 max-xl:data-abierta:flex max-xl:data-abierta:w-[min(640px,calc(100vw-24px))] max-xl:data-abierta:animate-[aparecer_.25s_ease-out_both]"></article>
    </div>
  </main>
</div>

<div id="velo" class="fixed inset-0 z-40 hidden bg-[#16223F]/30 backdrop-blur-[2px] animate-[fundido_.2s_ease-out_both] xl:hidden"></div>
<div id="aviso" role="status" class="pointer-events-none fixed bottom-6 left-1/2 z-50 hidden -translate-x-1/2 items-center gap-2.5 rounded-full bg-[#16223F] py-2.5 pr-5 pl-4 text-[14px] text-white shadow-[0_16px_40px_-12px_rgba(22,34,63,0.5)] animate-[aparecer_.25s_ease-out_both]"></div>

<script>
/* ======================================================================
   Maqueta B · Directorio (maestro-detalle). Datos 100 % inventados.
   Colores de texto: tinta #16223F · secundario #56627F · terciario #5F6B88
   (≥ 4,5:1 sobre blanco y #F5F7FC). #8C97B3 solo para íconos, «·» y placeholders.
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = (n) => Number(n).toLocaleString('es-CO');
const quitarTildes = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const norm = (s) => quitarTildes(s).toLowerCase();
const iconos = () => window.lucide && lucide.createIcons();

const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function fecha(v, conAnio = true) {
  if (!v) return null;
  const [a, m, d] = v.split('-').map(Number);
  return conAnio ? `${d} ${MESES[m - 1]} ${a}` : `${d} ${MESES[m - 1]}`;
}
function edad(v) {
  if (!v) return null;
  const n = new Date(`${v}T00:00:00`), h = new Date();
  let a = h.getFullYear() - n.getFullYear();
  if (h < new Date(h.getFullYear(), n.getMonth(), n.getDate())) a--;
  return a;
}
function telefono(t) {
  const d = String(t || '').replace(/\D/g, '');
  if (d.length === 10) return `${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6)}`;
  if (d.length === 7) return `${d.slice(0, 3)} ${d.slice(3)}`;
  return t;
}
/** "Apellido Apellido Nombre…" → [apellidos, nombres] (en la lista los apellidos van en negrita, como en Contactos). */
function partir(nombre) {
  const p = nombre.split(/\s+/);
  return p.length >= 3 ? [p.slice(0, 2).join(' '), p.slice(2).join(' ')] : [p[0], p.slice(1).join(' ')];
}
/** Iniciales de nombre + primer apellido: "Muñoz Escobar Alejandro" → "AM". */
function iniciales(nombre) {
  const p = nombre.split(/\s+/).filter(Boolean);
  return (p.length >= 3 ? p[2][0] + p[0][0] : p.slice(0, 2).map((x) => x[0]).join('')).toUpperCase();
}
/** Acudientes vienen en orden natural ("Nombre [Nombre] Apellido Apellido"). */
function inicialesNatural(nombre) {
  const p = nombre.split(/\s+/).filter(Boolean);
  return ((p[0]?.[0] || '') + (p[p.length >= 4 ? 2 : 1]?.[0] || '')).toUpperCase();
}
/** "Sandra Milena Sinisterra González" → "Sandra Sinisterra" (para la fila de la lista). */
function nombreCorto(nombre) {
  const p = String(nombre || '').split(/\s+/).filter(Boolean);
  return p.length >= 2 ? `${p[0]} ${p[p.length >= 4 ? 2 : 1]}` : p[0] || '';
}
const gradoCorto = (g) => (g.numero === 0 ? 'Tr' : `${g.numero}°`);

/* Un solo color de acento (#1E3A7B). El color de estado solo aparece como punto
   pequeño y únicamente cuando hay algo que notar. */
const ESTADOS = {
  activo: { t: 'Activo', punto: 'bg-[#2F9E6E]', txt: 'text-[#1C6B4A]' },
  retirado: { t: 'Retirado', punto: 'bg-[#D05454]', txt: 'text-[#A12B2B]' },
  cancelado: { t: 'Cancelado', punto: 'bg-[#9AA3B8]', txt: 'text-[#4E566B]' },
  trasladado: { t: 'Trasladado', punto: 'bg-[#D9A035]', txt: 'text-[#8A5A0B]' },
  graduado: { t: 'Graduado', punto: 'bg-[#5B7BD0]', txt: 'text-[#1E3A7B]' },
};
const CONDICIONES = {
  nuevo: { t: 'Nuevo', punto: 'bg-[#5B7BD0]', txt: 'text-[#1E3A7B]' },
  antiguo: { t: 'Antiguo', punto: 'bg-[#9AA3B8]', txt: 'text-[#4E566B]' },
  repitente: { t: 'Repitente', punto: 'bg-[#D9A035]', txt: 'text-[#8A5A0B]' },
  trasladado: { t: 'Trasladado', punto: 'bg-[#9B6BC9]', txt: 'text-[#6B3A9A]' },
};
const ORDEN_SEDES = { P: 0, LF: 1, CP: 2, RP: 3, PT: 4 };
const FILTROS = [
  { clave: 'activo', t: 'Activos' },
  { clave: 'inactivo', t: 'Retirados' },
  { clave: 'todos', t: 'Todos' },
];
const ALTO = '[@media(min-height:860px)]';
const BAJO = '[@media(max-height:720px)]';
const SEP = '<span aria-hidden="true" class="mx-1.5 text-[#8C97B3]">·</span>';

let D = null;
let todos = []; // todos los estudiantes cargados, para la búsqueda global
const metas = {};
const st = { gradoId: 11, grupoId: null, estado: 'activo', filtro: '', sel: null, menu: null, consulta: '', resIdx: 0, verTodos: false, abierta: false, m: null };
let visibles = [];
let resultados = [];

fetch('datos.json').then((r) => r.json()).then((d) => {
  D = d;
  for (const [gid, pg] of Object.entries(D.porGrado)) {
    metas[gid] = metaGrado(gid);
    for (const e of pg.estudiantes) todos.push({ ...e, gradoId: Number(gid) });
  }
  pintarBarra();
  cambiarGrado(st.gradoId);
});

/* --------------------------------------------------------------- grado */
function metaGrado(id) {
  const pg = D.porGrado[id];
  const grupos = pg.grupos
    .map((g) => ({ ...g, activos: Number(g.activos), nuevos: Number(g.nuevos), cupos: Number(g.cupos) }))
    .sort((a, b) => (ORDEN_SEDES[a.sede_codigo] ?? 9) - (ORDEN_SEDES[b.sede_codigo] ?? 9) || a.codigo.localeCompare(b.codigo, 'es', { numeric: true }));
  const cuenta = {};
  grupos.forEach((g) => (cuenta[g.codigo] = (cuenta[g.codigo] || 0) + 1));
  const conds = new Set(pg.estudiantes.map((e) => e.condicion));
  return {
    pg,
    grupos,
    porId: Object.fromEntries(grupos.map((g) => [g.id, g])),
    ambiguo: (codigo) => cuenta[codigo] > 1,
    variasSedes: new Set(grupos.map((g) => g.sede_codigo)).size > 1,
    variasJornadas: new Set(grupos.map((g) => g.jornada)).size > 1,
    hayModalidad: pg.estudiantes.some((e) => e.modalidad),
    // En Transición todos son nuevos: marcarlos uno por uno no dice nada.
    condicionUnica: conds.size === 1 ? [...conds][0] : null,
  };
}

function etiquetaGrupo(g, m = st.m) {
  if (!g) return '—';
  return m.ambiguo(g.codigo) ? `${g.codigo} · ${g.sede_codigo}` : g.codigo;
}
const nombreGrado = (id = st.gradoId) => D.grados.find((x) => x.id === Number(id)).nombre;

function cambiarGrado(id, { sel = null } = {}) {
  st.gradoId = id;
  st.grupoId = null;
  st.m = metas[id];
  pintarGrado();
  pintarChips();
  pintarResumen();
  pintarEstados();
  pintarLista();
  st.sel = sel ?? visibles[0]?.id ?? st.sel;
  pintarLista();
  pintarFicha({ animar: true });
  $('#lista').scrollTop = 0;
  if (sel) mostrarFila(sel, 'center');
}

function pintarBarra() {
  const t = D.totales;
  $('#anio-actual').textContent = D.anio;
  const sep = '<span aria-hidden="true" class="h-3.5 w-px bg-[#D3DDF3]"></span>';
  $('#totales').innerHTML = `<span class="text-[#5F6B88]">Colegio</span>` + [
    `<span><b class="font-semibold text-[#16223F] tabular-nums">${fmt(t.activos)}</b> activos</span>`,
    `<span><b class="font-semibold text-[#16223F] tabular-nums">${fmt(t.nuevos)}</b> nuevos</span>`,
    `<span><b class="font-semibold text-[#16223F] tabular-nums">${fmt(t.retirados)}</b> retirados</span>`,
  ].join(sep);
  $('#totales').title = `Totales de todo el colegio en ${D.anio}`;
}

function pintarGrado() {
  const g = D.grados.find((x) => x.id === st.gradoId);
  $('#titulo-grado').textContent = g.nombre;
  $('#grado-corto').textContent = gradoCorto(g);
  $('#btn-grado').title = `${g.nombre}: ${fmt(g.activos)} activos en ${g.grupos} grupos · cambiar de grado`;
  document.title = `${g.nombre} · Estudiantes · SIEAGE`;
  pintarPlaceholder();
}
function pintarPlaceholder() {
  const g = st.m.porId[st.grupoId];
  $('#filtro').setAttribute('aria-label', `Filtrar la lista de ${g ? etiquetaGrupo(g) : nombreGrado()} por nombre o documento`);
}

/* --------------------------------------------------------------- grupos */
/** Cada grupo en un chip de dos renglones: código y activos/cupos. Así se comparan de un vistazo. */
function pintarChips() {
  const m = st.m;
  const chip = (act, codigo, activos, cupos, attrs) => {
    const exceso = activos > cupos;
    const ocup = act
      ? (exceso ? 'font-semibold text-[#FFC9C9]' : 'text-white/75')
      : (exceso ? 'font-semibold text-[#A12B2B]' : 'text-[#56627F]');
    return `<button type="button" ${attrs} aria-pressed="${act}" class="flex h-12 min-w-[54px] shrink-0 flex-col items-center justify-center rounded-[14px] px-2 transition focus-visible:ring-4 focus-visible:ring-[#DCE5F8] focus-visible:outline-none ${
      act ? 'bg-[#1E3A7B] text-white shadow-[0_10px_18px_-12px_rgba(30,58,123,0.95)]'
          : `bg-white text-[#16223F] shadow-[0_1px_2px_rgba(22,34,63,0.05)] ring-1 ${exceso ? 'ring-[#EBC3C3]' : 'ring-[#E3E9F6]'} hover:ring-[#C4D2F1]`
    }"><span class="text-[14px] leading-[18px] font-semibold whitespace-nowrap">${codigo}</span><span class="text-[13px] leading-4 whitespace-nowrap tabular-nums ${ocup}">${activos}/${cupos}</span></button>`;
  };
  const deGrupo = (g) => {
    const titulo = `${g.codigo} · ${g.sede} · ${g.jornada}${g.director ? ` · Dir. ${g.director}` : ''} · ${g.activos} de ${g.cupos} cupos`;
    return chip(st.grupoId === g.id, g.codigo, g.activos, g.cupos, `data-grupo="${g.id}" title="${esc(titulo)}"`);
  };
  const totA = m.grupos.reduce((s, x) => s + x.activos, 0), totC = m.grupos.reduce((s, x) => s + x.cupos, 0);
  let html = chip(st.grupoId === null, 'Todos', totA, totC, `data-grupo="" title="Todos los grupos de ${esc(nombreGrado())}: ${totA} activos de ${totC} cupos"`);
  if (m.variasSedes) {
    // Varias sedes: la sede se escribe una vez, encima de sus grupos.
    const porSede = [];
    for (const g of m.grupos) {
      const ult = porSede[porSede.length - 1];
      if (ult && ult.cod === g.sede_codigo) ult.gs.push(g); else porSede.push({ cod: g.sede_codigo, sede: g.sede, gs: [g] });
    }
    html += porSede.map((s) => `
      <div class="ml-1 flex flex-col gap-1">
        <span title="${esc(s.sede)}" class="flex items-center gap-2 pl-1 text-[12px] leading-4 font-semibold tracking-[0.1em] text-[#56627F] uppercase after:h-px after:flex-1 after:bg-[#D3DDF3]">${s.cod}</span>
        <div class="flex gap-1">${s.gs.map(deGrupo).join('')}</div>
      </div>`).join('');
  } else html += m.grupos.map(deGrupo).join('');
  $('#chips').innerHTML = html;
}

function contar(lista, clave) {
  const c = new Map();
  for (const e of lista) { const k = clave(e); if (k) c.set(k, (c.get(k) || 0) + 1); }
  return [...c.entries()].sort((a, b) => b[1] - a[1]);
}

/** Cabecera de la lista en un renglón: quién dirige el grupo y cuántos cupos quedan. */
function pintarResumen() {
  const m = st.m;
  const g = m.porId[st.grupoId];
  const nuevosDe = (lista) => lista.filter((e) => e.estado === 'activo' && e.condicion === 'nuevo').length;
  let partes, reparto = '', repartoTitulo = '', ocupados, cupos, titulo;
  if (g) {
    ocupados = g.activos; cupos = g.cupos;
    const nuevos = nuevosDe(m.pg.estudiantes.filter((e) => e.grupo_id === g.id));
    partes = [
      `<span class="text-[#5F6B88]">Dir.</span> <span class="font-medium text-[#16223F]">${esc(g.director || 'sin asignar')}</span>`,
      esc(g.jornada),
      m.variasSedes ? esc(g.sede) : null,
      m.condicionUnica === 'nuevo' ? null : `${nuevos} ${nuevos === 1 ? 'nuevo' : 'nuevos'}`,
    ];
    titulo = `${g.codigo} · Dir. ${g.director || 'sin asignar'} · ${g.sede} · ${g.jornada}`;
  } else {
    ocupados = m.grupos.reduce((s, x) => s + x.activos, 0);
    cupos = m.grupos.reduce((s, x) => s + x.cupos, 0);
    const sedes = [...new Set(m.grupos.map((x) => x.sede))];
    const jornadas = [...new Set(m.grupos.map((x) => x.jornada))];
    partes = [
      sedes.length === 1 ? `<span class="font-medium text-[#16223F]">${esc(sedes[0])}</span>` : `<span class="font-medium text-[#16223F]">${sedes.length} sedes</span>`,
      jornadas.length === 1 ? esc(jornadas[0]) : jornadas.map((j) => j.toLowerCase()).join(' y '),
      m.condicionUnica === 'nuevo' ? 'todos nuevos' : `${nuevosDe(m.pg.estudiantes)} nuevos`,
    ];
    // Reparto (secundario): por modalidad si existe; si no, por sede y jornada. En portátil va solo en el title.
    const activos = m.pg.estudiantes.filter((e) => e.estado === 'activo');
    const rep = m.hayModalidad ? contar(activos, (e) => e.modalidad)
      : [...(m.variasSedes ? contar(activos, (e) => e.sede_codigo) : []), ...(m.variasJornadas ? contar(activos, (e) => e.jornada) : [])];
    reparto = rep.map(([k, v]) => `${esc(k)} <b class="font-semibold text-[#3E4A68] tabular-nums">${v}</b>`).join(SEP);
    repartoTitulo = rep.length ? `${m.hayModalidad ? 'Por modalidad' : 'Reparto'} (activos): ${rep.map(([k, v]) => `${k} ${v}`).join(' · ')}` : '';
    titulo = `${nombreGrado()} · ${sedes.join(', ')}${repartoTitulo ? ` · ${repartoTitulo}` : ''}`;
  }
  const libres = cupos - ocupados;
  const exceso = libres < 0;
  $('#resumen').innerHTML = `
    <div class="flex items-baseline gap-4" title="${esc(titulo)}">
      <p class="min-w-0 flex-1 truncate text-[14px] leading-5 text-[#56627F]">${partes.filter(Boolean).join(SEP)}</p>
      <p class="shrink-0 text-[14px] leading-5 tabular-nums ${exceso ? 'font-semibold text-[#A12B2B]' : 'text-[#56627F]'}">${
        exceso ? `${-libres} en sobrecupo` : `<b class="font-semibold text-[#16223F]">${libres}</b> ${g ? (libres === 1 ? 'libre' : 'libres') : 'cupos libres'}`}</p>
    </div>
    ${reparto ? `<p class="mt-1 truncate text-[13px] leading-[18px] text-[#56627F] ${BAJO}:hidden" title="${esc(repartoTitulo)}">${reparto}</p>` : ''}`;
}

/* --------------------------------------------------------------- estado + lista */
function pasaEstado(e, clave) {
  return clave === 'todos' || (clave === 'activo' ? e.estado === 'activo' : e.estado !== 'activo');
}
function coincide(e, tokens, digitos) {
  return (digitos.length >= 3 && e.numero_documento.includes(digitos)) || tokens.every((k) => norm(e.nombre).includes(k));
}
function calcularVisibles() {
  const t = norm(st.filtro.trim());
  const tokens = t.split(/\s+/).filter(Boolean);
  const digitos = t.replace(/\D/g, '');
  return st.m.pg.estudiantes.filter((e) =>
    (st.grupoId === null || e.grupo_id === st.grupoId) &&
    pasaEstado(e, st.estado) &&
    (!tokens.length || coincide(e, tokens, digitos)));
}

function pintarEstados() {
  const base = st.m.pg.estudiantes.filter((e) => st.grupoId === null || e.grupo_id === st.grupoId);
  $('#estados').innerHTML = FILTROS.map((f) => {
    const act = st.estado === f.clave;
    const n = base.filter((e) => pasaEstado(e, f.clave)).length;
    return `<button type="button" data-estado="${f.clave}" aria-pressed="${act}" class="flex h-8 items-center gap-1 rounded-[10px] px-2 text-[14px] font-medium whitespace-nowrap transition focus-visible:ring-2 focus-visible:ring-[#9DB2E6] focus-visible:outline-none ${
      act ? 'bg-white text-[#1E3A7B] shadow-[0_1px_3px_rgba(22,34,63,0.12)]' : 'text-[#56627F] hover:text-[#16223F]'
    }">${f.t}<span class="text-[13px] tabular-nums ${act ? 'text-[#5B7BD0]' : 'text-[#5F6B88]'}">${n}</span></button>`;
  }).join('');
}

/** Lo único que se marca en la fila: lo que se sale de lo normal en la vista actual. */
function marcador(e) {
  if (e.estado !== 'activo') {
    const ficha = D.fichas[e.id]?.actual;
    // Con el filtro «Retirados» todas lo son: se muestra cuándo se retiraron, sin color.
    if (st.estado === 'inactivo' && e.estado === 'retirado' && ficha?.fecha_retiro)
      return { t: fecha(ficha.fecha_retiro, false), txt: 'text-[#5F6B88]', titulo: `Se retiró el ${fecha(ficha.fecha_retiro)}` };
    return ESTADOS[e.estado] || ESTADOS.cancelado;
  }
  if (st.m.condicionUnica) return null;
  if (e.condicion === 'repitente' || e.condicion === 'nuevo' || e.condicion === 'trasladado') return CONDICIONES[e.condicion];
  return null;
}

function fila(e) {
  const sel = e.id === st.sel;
  const [ap, nom] = partir(e.nombre);
  const inactivo = e.estado !== 'activo';
  const mk = marcador(e);
  const m = st.m;
  const g = m.porId[e.grupo_id];
  const extra = [
    m.hayModalidad ? e.modalidad || 'Sin modalidad' : null,
    !m.hayModalidad && m.variasJornadas && st.grupoId === null ? e.jornada : null,
  ].filter(Boolean);
  const grupoTxt = st.grupoId === null ? etiquetaGrupo(g) : '';
  const gris = sel ? 'text-white/75' : 'text-[#56627F]';
  const tel = e.telefono ? telefono(e.telefono) : null;
  // Renglón 1: nombre ··· marca · grupo. Renglón 2: documento ··· acudiente · teléfono.
  return `<button type="button" role="option" id="f-${e.id}" data-id="${e.id}" aria-selected="${sel}" tabindex="${sel ? 0 : -1}"
    class="block w-full scroll-mt-7 scroll-mb-3 rounded-[12px] px-3 py-1.5 text-left transition-colors outline-none focus-visible:ring-2 focus-visible:ring-[#9DB2E6] ${BAJO}:py-[3px] ${
      sel ? 'bg-[#1E3A7B] text-white shadow-[0_12px_24px_-14px_rgba(30,58,123,0.9)]' : 'hover:bg-white'
    }">
    <span class="flex items-baseline gap-3">
      <span class="min-w-0 flex-1 truncate text-[15px] leading-5 ${sel ? '' : inactivo ? 'text-[#56627F]' : ''}"><span class="font-semibold">${esc(ap)}</span> ${esc(nom)}</span>
      ${mk ? `<span class="flex shrink-0 items-center gap-1.5 self-center text-[13px] leading-5 ${sel ? 'text-white/85' : mk.txt}" ${mk.titulo ? `title="${esc(mk.titulo)}"` : ''}>${mk.punto ? `<span class="size-1.5 rounded-full ${sel ? 'bg-white/85' : mk.punto}"></span>` : ''}${mk.t}</span>` : ''}
      ${grupoTxt ? `<span class="shrink-0 text-[13px] leading-5 font-medium tabular-nums ${sel ? 'text-white' : 'text-[#3E4A68]'}">${esc(grupoTxt)}</span>` : ''}
    </span>
    <span class="flex items-baseline gap-3 text-[13px] leading-[18px] ${gris}">
      <span class="shrink-0 tabular-nums">${esc(e.tipo_documento)} ${esc(e.numero_documento)}</span>
      ${extra.length ? `<span class="min-w-0 -ml-2 truncate">· ${extra.map(esc).join(' · ')}</span>` : ''}
      <span class="ml-auto flex min-w-0 items-baseline justify-end" title="Acudiente: ${esc(e.acudiente || 'sin registrar')}${tel ? ` · ${tel}` : ''}">
        ${e.acudiente ? `<span class="min-w-0 truncate max-sm:hidden">${esc(nombreCorto(e.acudiente))}</span>` : ''}
        ${tel ? `<span class="shrink-0 tabular-nums ${sel ? 'text-white/90' : 'text-[#3E4A68]'}">${e.acudiente ? `<span aria-hidden="true" class="mx-1 max-sm:hidden ${sel ? 'text-white/50' : 'text-[#8C97B3]'}">·</span>` : ''}${tel}</span>` : ''}
      </span>
    </span>
  </button>`;
}

function inicialDe(nombre) {
  return quitarTildes(nombre.trim()[0] || '#').toUpperCase();
}

function pintarLista() {
  visibles = calcularVisibles();
  const el = $('#lista');
  $('#limpiar-filtro-x').classList.toggle('hidden', !st.filtro);
  $('#limpiar-filtro-x').classList.toggle('flex', !!st.filtro);
  if (!visibles.length) {
    const q = st.filtro.trim();
    const g = st.m.porId[st.grupoId];
    const donde = `${nombreGrado()}${g ? ` ${etiquetaGrupo(g)}` : ''}`;
    // ¿Existe en otro lado? La búsqueda global abarca todo el colegio.
    const fuera = q ? buscar(q).filter((e) => !(e.gradoId === st.gradoId && (st.grupoId === null || e.grupo_id === st.grupoId) && pasaEstado(e, st.estado))) : [];
    el.innerHTML = `
      <div class="flex h-full min-h-[240px] flex-col items-center justify-center gap-2 px-8 text-center animate-[fundido_.2s_ease-out_both]">
        <span class="mb-1 flex size-12 items-center justify-center rounded-[16px] bg-white text-[#5B7BD0] shadow-[0_1px_2px_rgba(22,34,63,0.06)] ring-1 ring-[#E3E9F6]"><i data-lucide="${q ? 'search-x' : 'user-round-check'}" class="size-5"></i></span>
        <p class="text-[15px] font-semibold">${q ? `Nadie con «${esc(q)}» en ${esc(donde)}` : `No hay ${st.estado === 'inactivo' ? 'retirados' : 'estudiantes'} aquí`}</p>
        <p class="text-[14px] text-[#56627F]">${q
          ? (fuera.length ? `Hay ${fuera.length === 1 ? '1 coincidencia' : `${fuera.length} coincidencias`} en otros grupos, grados o estados.` : 'Este filtro solo mira la lista de la izquierda.')
          : `${esc(donde)} no tiene estudiantes con este estado.`}</p>
        ${q ? `<div class="mt-2 flex flex-wrap items-center justify-center gap-2">
          <button type="button" id="buscar-colegio" class="flex h-10 items-center gap-2 rounded-[14px] bg-[#1E3A7B] px-4 text-[14px] font-semibold text-white shadow-[0_12px_24px_-12px_rgba(30,58,123,0.6)] transition hover:bg-[#172E63] focus-visible:ring-4 focus-visible:ring-[#B7C6EA] focus-visible:outline-none"><i data-lucide="search" class="size-4"></i>Buscar «${esc(q.length > 14 ? q.slice(0, 14) + '…' : q)}» en todo el colegio</button>
          <button type="button" id="limpiar-filtro" class="h-10 rounded-[14px] bg-white px-4 text-[14px] font-medium text-[#1E3A7B] ring-1 ring-[#D3DDF3] transition hover:ring-[#1E3A7B]">Limpiar filtro</button>
        </div>` : ''}
      </div>`;
    iconos();
    return;
  }
  // Las letras (A, B, C…) ayudan a ubicarse en un grado entero; en un grupo de 30 sobran.
  const conLetras = visibles.length > 40;
  let html = conLetras ? '' : '<div role="presentation" class="pt-1.5">', letra = conLetras ? null : '';
  for (const e of visibles) {
    const l = conLetras ? inicialDe(e.nombre) : '';
    if (l !== letra) {
      if (letra !== null) html += '</div>';
      letra = l;
      html += `<div role="presentation"><p class="sticky top-0 z-10 bg-[#F5F7FC] px-3 pt-1.5 pb-0.5 text-[12px] leading-4 font-semibold tracking-[0.14em] text-[#5F6B88] after:pointer-events-none after:absolute after:inset-x-0 after:top-full after:h-2.5 after:bg-gradient-to-b after:from-[#F5F7FC] after:to-transparent">${l}</p>`;
    }
    html += fila(e);
  }
  el.innerHTML = html + '</div>';
}

function repintarFila(id) {
  const vieja = document.getElementById(`f-${id}`);
  const e = visibles.find((x) => x.id === id);
  if (vieja && e) vieja.outerHTML = fila(e);
}

function mostrarFila(id, block = 'nearest') {
  const f = document.getElementById(`f-${id}`);
  if (f) f.scrollIntoView({ block });
}

function seleccionar(id, { enfocar = false, abrir = true, animar = true } = {}) {
  if (id === st.sel) { if (abrir) abrirFicha(); return; }
  const antes = st.sel;
  st.sel = id;
  repintarFila(antes);
  repintarFila(id);
  pintarFicha({ animar });
  mostrarFila(id);
  if (enfocar) document.getElementById(`f-${id}`)?.focus({ preventScroll: true });
  if (abrir) abrirFicha();
}

function mover(paso) {
  if (!visibles.length) return;
  const i = visibles.findIndex((e) => e.id === st.sel);
  const j = i < 0 ? 0 : Math.min(Math.max(i + paso, 0), visibles.length - 1);
  const enLista = document.activeElement?.closest?.('#lista');
  // Desde el teclado no se anima: al mantener ↓ la ficha no parpadea.
  seleccionar(visibles[j].id, { enfocar: !!enLista, abrir: false, animar: false });
}

/** Tras cambiar un filtro: si el elegido ya no está en la lista, se elige el primero (la ficha nunca queda vacía). */
function refiltrar() {
  pintarEstados();
  pintarLista();
  if (visibles.length && !visibles.some((e) => e.id === st.sel)) {
    st.sel = visibles[0].id;
    pintarLista();
    pintarFicha();
    $('#lista').scrollTop = 0;
  } else mostrarFila(st.sel);
  iconos();
}
function limpiarFiltro() { st.filtro = ''; $('#filtro').value = ''; refiltrar(); }

/* --------------------------------------------------------------- ficha */
function pildora(info) {
  return `<span class="inline-flex items-center gap-1.5 rounded-full bg-white/85 px-2.5 py-[3px] text-[13px] leading-5 font-medium ${info.txt} shadow-[0_1px_2px_rgba(22,34,63,0.05)]"><span class="size-1.5 rounded-full ${info.punto}"></span>${info.t}</span>`;
}
/** Dato clave en fila plana (sin caja), separado del anterior por una línea fina. */
function dato(etiqueta, valor, nota = '') {
  return `<div class="min-w-0 @2xl:border-l @2xl:border-[#C4D2F1] @2xl:px-5 @2xl:first:border-l-0 @2xl:first:pl-0 @2xl:last:pr-0 ${ALTO}:@2xl:px-7">
    <dt class="text-[13px] leading-[18px] whitespace-nowrap text-[#56627F]">${etiqueta}</dt>
    <dd class="mt-0.5 truncate text-[15px] leading-5 font-semibold whitespace-nowrap ${ALTO}:text-[16px] ${ALTO}:leading-[22px]">${valor ?? '—'}</dd>
    ${nota ? `<dd class="truncate text-[13px] leading-[18px] whitespace-nowrap text-[#56627F]">${nota}</dd>` : ''}
  </div>`;
}
function titulo(t, derecha = '') {
  return `<div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-0.5"><h3 class="text-[12px] font-semibold tracking-[0.12em] whitespace-nowrap text-[#56627F] uppercase">${t}</h3>${derecha}</div>`;
}

/** Renglón de contacto al estilo Contactos: etiqueta · valor · acción. */
function campo(etiqueta, valor, accion = '') {
  return `<div class="flex min-h-9 items-center gap-3 py-0.5 ${BAJO}:min-h-8 ${BAJO}:py-0 ${ALTO}:min-h-11 ${ALTO}:py-1">
    <dt class="w-[68px] shrink-0 text-[13px] text-[#5F6B88]">${etiqueta}</dt>
    <dd class="min-w-0 flex-1 truncate text-[15px] font-medium">${valor}</dd>
    ${accion}
  </div>`;
}
const accion = (href, icono, texto, titulo) =>
  `<a href="${href}" title="${esc(titulo)}" class="flex h-8 shrink-0 items-center gap-1.5 rounded-full bg-[#EEF2FB] px-3 text-[13px] font-semibold text-[#1E3A7B] transition hover:bg-[#1E3A7B] hover:text-white focus-visible:ring-4 focus-visible:ring-[#B7C6EA] focus-visible:outline-none"><i data-lucide="${icono}" class="size-3.5"></i>${texto}</a>`;

/** Versión amplia (un acudiente, o pantallas altas): datos en renglones, sin cajas. */
function fichaAcudiente(a, varios, mostrarDireccion) {
  const filas = [];
  if (!a.telefono_celular && !a.telefono_fijo) filas.push(campo('Teléfono', '<span class="font-normal text-[#5F6B88]">Sin registrar</span>'));
  // Celular con su botón «Llamar»; el fijo, si también existe, en su propio renglón.
  const tel1 = a.telefono_celular || a.telefono_fijo;
  const tel2 = a.telefono_celular && a.telefono_fijo;
  if (tel1) filas.push(campo(
    a.telefono_celular ? 'Celular' : 'Fijo',
    `<a href="tel:${tel1.replace(/\D/g, '')}" class="tabular-nums hover:text-[#1E3A7B]">${telefono(tel1)}</a>`,
    accion(`tel:${tel1.replace(/\D/g, '')}`, 'phone', 'Llamar', `Llamar a ${a.nombre}`)));
  // El fijo va en su renglón, como enlace (un solo botón «Llamar» por acudiente).
  if (tel2) filas.push(campo('Fijo', `<a href="tel:${tel2.replace(/\D/g, '')}" class="tabular-nums hover:text-[#1E3A7B]">${telefono(tel2)}</a>`));
  if (a.email) filas.push(campo('Correo', `<a href="mailto:${esc(a.email)}" class="hover:text-[#1E3A7B]">${esc(a.email)}</a>`, accion(`mailto:${esc(a.email)}`, 'mail', 'Escribir', `Escribir a ${a.email}`)));
  if (mostrarDireccion && (a.direccion || a.barrio)) filas.push(campo('Dirección', esc([a.direccion, a.barrio].filter(Boolean).join(' · '))));
  return `
    <div>
      <div class="flex items-center gap-3">
        <span class="flex size-10 shrink-0 items-center justify-center rounded-full bg-[#EEF2FB] text-[14px] font-semibold text-[#1E3A7B] ${ALTO}:size-11 ${ALTO}:text-[15px]">${inicialesNatural(a.nombre)}</span>
        <div class="min-w-0 flex-1">
          <p class="truncate text-[16px] leading-5 font-semibold">${esc(a.nombre)}</p>
          <p class="mt-0.5 truncate text-[13px] leading-[18px] text-[#56627F]">${esc(a.parentesco)} · ${esc(a.tipo_documento)} ${esc(a.numero_documento)}${varios && a.es_principal ? ' · <span class="font-medium text-[#1E3A7B]">principal</span>' : ''}</p>
        </div>
      </div>
      <dl class="mt-1.5 ml-[52px] divide-y divide-[#EEF2F9] border-t border-[#EEF2F9] @max-lg:ml-0 ${ALTO}:ml-14">${filas.join('')}</dl>
    </div>`;
}

/** Versión compacta (dos o más acudientes en portátil): una tarjeta por acudiente, con el número en el botón. */
function tarjetaAcudiente(a, varios, mostrarDireccion) {
  const cel = a.telefono_celular || a.telefono_fijo;
  const fijoAparte = a.telefono_celular && a.telefono_fijo;
  const linea2 = [
    esc(a.parentesco),
    varios && a.es_principal ? '<span class="font-medium text-[#1E3A7B]">principal</span>' : null,
    fijoAparte ? `<a href="tel:${a.telefono_fijo.replace(/\D/g, '')}" class="hover:text-[#1E3A7B] hover:underline">fijo ${telefono(a.telefono_fijo)}</a>` : null,
  ].filter(Boolean); // el correo va en el botón de sobre (con el correo en su título): así nada queda cortado
  const direccion = mostrarDireccion && (a.direccion || a.barrio)
    ? `<p class="mt-1 flex items-center gap-1.5 truncate text-[13px] text-[#56627F]"><i data-lucide="map-pin" class="size-3.5 shrink-0"></i>${esc([a.direccion, a.barrio].filter(Boolean).join(' · '))}</p>` : '';
  return `
    <div class="flex items-center gap-3 rounded-[18px] bg-[#F5F7FC] py-2.5 pr-2.5 pl-4 ${ALTO}:py-3.5">
      <div class="min-w-0 flex-1">
        <p class="truncate text-[15px] leading-5 font-semibold" title="${esc(a.nombre)} · ${esc(a.tipo_documento)} ${esc(a.numero_documento)}">${esc(a.nombre)}</p>
        <p class="mt-0.5 flex min-w-0 items-center gap-1.5 text-[13px] leading-[18px] whitespace-nowrap text-[#56627F]">${linea2.join('<span class="text-[#8C97B3]">·</span>')}</p>
        ${direccion}
      </div>

  const el = $('#ficha');
  if (!f) return;
  const { estudiante: e, actual: a, historia, acudientes } = f;
  const est = ESTADOS[a?.estado] || ESTADOS.cancelado;

              const verSede = ultimo || h.sede !== historia[i - 1].sede;
              return `<li class="relative flex items-start gap-3 py-1 ${BAJO}:py-[3px] ${ALTO}:py-[9px]">

                ${nota}
              </li>`;
            }).join('')}
          </ol>
          ${obsIzq ? '' : observaciones}
        </section>
      </div>
    </div>`;
  iconos();
  // Si no cabe, se prueba con las observaciones en la otra columna y se deja la que menos sobre.
  if (a?.observaciones && !opc.voltear && !opc.final) {
    const sobra = () => { const c = el.querySelector('[data-cuerpo]'); return c.scrollHeight - c.clientHeight; };

    if (antes > 1) {
      pintarFicha({ voltear: true });
      if (sobra() >= antes) pintarFicha({ final: true });
    }
  }
}

/* --------------------------------------------------------------- búsqueda global */
const PRIMEROS = 7;
function buscar(q) {
  const t = norm(q.trim());
  if (t.length < 2) return [];
  const tokens = t.split(/\s+/).filter(Boolean);
  const digitos = t.replace(/\D/g, '');
  return todos
    .filter((e) => coincide(e, tokens, digitos))
    .sort((a, b) => {
      const pa = norm(a.nombre).startsWith(tokens[0]) ? 0 : 1, pb = norm(b.nombre).startsWith(tokens[0]) ? 0 : 1;
      return pa - pb || (a.estado === 'activo' ? 0 : 1) - (b.estado === 'activo' ? 0 : 1) || a.nombre.localeCompare(b.nombre, 'es');
    });
}
function resaltar(nombre, q) {
  const tokens = norm(q.trim()).split(/\s+/).filter(Boolean);
  const n = norm(nombre);
  const marca = new Array(nombre.length).fill(false);
  for (const k of tokens) { let i = n.indexOf(k); while (i >= 0) { for (let j = i; j < i + k.length; j++) marca[j] = true; i = n.indexOf(k, i + k.length); } }
  let html = '', dentro = false;
  [...nombre].forEach((c, i) => {
    if (marca[i] && !dentro) { html += '<span class="font-semibold text-[#1E3A7B]">'; dentro = true; }
    if (!marca[i] && dentro) { html += '</span>'; dentro = false; }
    html += esc(c);
  });
  return html + (dentro ? '</span>' : '');
}
function resaltarDoc(doc, q) {
  const d = q.replace(/\D/g, '');
  const i = d.length >= 3 ? doc.indexOf(d) : -1;
  return i < 0 ? esc(doc) : `${esc(doc.slice(0, i))}<span class="font-semibold text-[#1E3A7B]">${esc(d)}</span>${esc(doc.slice(i + d.length))}`;
}
function pintarResultados() {
  const q = st.consulta;
  const caja = $('#resultados');
  $('#limpiar-busqueda').classList.toggle('hidden', !q);
  $('#limpiar-busqueda').classList.toggle('flex', !!q);
  $('#atajo-busqueda').classList.toggle('hidden', !!q);
  if (q.trim().length < 2) { caja.classList.add('hidden'); $('#busqueda').setAttribute('aria-expanded', 'false'); return; }
  resultados = buscar(q);
  // Con ↓ más allá del séptimo, o con «Ver los N», se muestran todos (con scroll propio).
  if (st.resIdx >= PRIMEROS) st.verTodos = true;
  const mostrados = st.verTodos ? resultados : resultados.slice(0, PRIMEROS);
  st.resIdx = Math.min(st.resIdx, Math.max(mostrados.length - 1, 0));
  caja.classList.remove('hidden');
  $('#busqueda').setAttribute('aria-expanded', 'true');
  const faltan = resultados.length - mostrados.length;
  caja.innerHTML = `
    <div class="overflow-hidden rounded-[20px] bg-white p-1.5 shadow-[0_24px_60px_-20px_rgba(22,34,63,0.35)] ring-1 ring-[#E3E9F6] animate-[emerger_.16s_ease-out_both]">
      ${resultados.length ? `
        <p class="px-3 pt-2 pb-1.5 text-[12px] font-semibold tracking-[0.12em] text-[#56627F] uppercase">${faltan ? `Primeros ${mostrados.length} de ${resultados.length}` : `${resultados.length} ${resultados.length === 1 ? 'resultado' : 'resultados'}`} · todo el colegio · ${D.anio}</p>
        <ul id="lista-resultados" role="listbox" aria-label="Resultados de la búsqueda" class="${st.verTodos ? 'max-h-[min(420px,calc(100vh-240px))] overflow-y-auto overscroll-contain [scrollbar-color:#D3DDF3_transparent] [scrollbar-width:thin]' : ''}">
          ${mostrados.map((e, i) => {
            const act = i === st.resIdx;
            const mk = e.estado !== 'activo' ? ESTADOS[e.estado] || ESTADOS.cancelado : null;
            const m = metas[e.gradoId];
            const g = m.porId[e.grupo_id];
            return `<li role="option" aria-selected="${act}" data-res="${i}" class="flex cursor-pointer items-center gap-3 rounded-[14px] px-2.5 py-2 transition-colors ${act ? 'bg-[#EEF2FB]' : 'hover:bg-[#F5F7FC]'}">
              <span class="flex size-9 shrink-0 items-center justify-center rounded-full text-[13px] font-semibold ${act ? 'bg-[#1E3A7B] text-white' : 'bg-[#EEF2FB] text-[#1E3A7B]'}">${iniciales(e.nombre)}</span>
              <span class="min-w-0 flex-1">
                <span class="block truncate text-[15px] leading-5">${resaltar(e.nombre, q)}</span>
                <span class="block truncate text-[13px] leading-[18px] text-[#56627F]">${esc(e.tipo_documento)} ${resaltarDoc(e.numero_documento, q)} · ${nombreGrado(e.gradoId)} ${esc(g ? etiquetaGrupo(g, m) : e.grupo ?? '')}</span>
              </span>
              ${mk ? `<span class="flex shrink-0 items-center gap-1.5 text-[13px] ${mk.txt}"><span class="size-1.5 rounded-full ${mk.punto}"></span>${mk.t}</span>` : ''}
              <i data-lucide="corner-down-left" class="size-4 shrink-0 text-[#8C97B3] ${act ? '' : 'invisible'}"></i>
            </li>`;
          }).join('')}
        </ul>
        ${faltan ? `<button type="button" id="ver-todos" class="mt-1 flex h-10 w-full items-center justify-center gap-1.5 rounded-[14px] text-[14px] font-semibold text-[#1E3A7B] transition hover:bg-[#EEF2FB]">Ver los ${resultados.length} resultados<i data-lucide="chevron-down" class="size-4"></i></button>` : ''}
        <p class="mt-1 flex items-center gap-3 border-t border-[#EEF2F9] px-3 pt-2.5 pb-1.5 text-[13px] text-[#5F6B88]">
          <span class="flex items-center gap-1"><kbd class="flex items-center text-[#3E4A68]"><i data-lucide="arrow-up" class="size-3.5"></i><i data-lucide="arrow-down" class="size-3.5"></i></kbd>moverse</span><span><kbd class="font-sans font-medium text-[#3E4A68]">Enter</kbd> abrir</span><span><kbd class="font-sans font-medium text-[#3E4A68]">Esc</kbd> cerrar</span>
        </p>` : `
        <div class="flex items-center gap-3 px-3 py-4">
          <span class="flex size-9 items-center justify-center rounded-full bg-[#F5F7FC] text-[#5F6B88]"><i data-lucide="search-x" class="size-4"></i></span>
          <div><p class="text-[15px] font-medium">Nadie con «${esc(q.trim())}» en ${D.anio}</p><p class="text-[13px] text-[#56627F]">Revisa el documento o prueba solo con un apellido.</p></div>
        </div>`}
    </div>`;
  iconos();
  caja.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
}
function cerrarBusqueda() {
  const caja = $('#resultados');
  if (caja.classList.contains('hidden')) return false;
  caja.classList.add('hidden');
  $('#busqueda').setAttribute('aria-expanded', 'false');
  return true;
}
function elegirResultado(e) {
  if (!e) return;
  st.consulta = '';
  $('#busqueda').value = '';
  pintarResultados();
  cerrarBusqueda();
  $('#busqueda').blur();
  // Que el elegido quede visible en la lista: su grado, todos los grupos y un estado que lo incluya.
  st.filtro = '';
  $('#filtro').value = '';
  if (!pasaEstado(e, st.estado)) st.estado = 'todos';
  if (e.gradoId !== st.gradoId) cambiarGrado(e.gradoId, { sel: e.id });
  else {
    st.grupoId = null;
    pintarChips(); pintarResumen(); pintarEstados(); pintarPlaceholder(); pintarLista();
    st.sel = null;
    seleccionar(e.id, { abrir: false });
    mostrarFila(e.id, 'center');
  }
  abrirFicha();
  document.getElementById(`f-${e.id}`)?.focus({ preventScroll: true });
}

/* --------------------------------------------------------------- eventos */
$('#btn-grado').addEventListener('click', () => (st.menu === 'grado' ? cerrarMenus() : abrirMenu('grado')));
$('#btn-anio').addEventListener('click', () => (st.menu === 'anio' ? cerrarMenus() : abrirMenu('anio')));

$('#menu-grado').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-grado]');
  if (!b) return;
  const id = Number(b.dataset.grado);
  cerrarMenus();
  if (id === st.gradoId) return;
  if (!D.porGrado[id]) {
    const g = D.grados.find((x) => x.id === id);
    avisar(`${g.nombre}: sin datos en la maqueta. Prueba con Transición o Décimo.`);
    return;
  }
  st.filtro = ''; $('#filtro').value = '';
  cambiarGrado(id);
  iconos();
});
$('#menu-anio').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-anio]');
  if (!b) return;
  cerrarMenus();
  if (Number(b.dataset.anio) !== D.anio) avisar(`${b.dataset.anio}: sin datos en la maqueta. Solo hay datos de ${D.anio}.`);
});

$('#chips').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-grupo]');
  if (!b) return;
  const id = b.dataset.grupo ? Number(b.dataset.grupo) : null;
  st.grupoId = st.grupoId === id ? null : id;
  pintarChips(); pintarResumen(); pintarPlaceholder(); refiltrar();
});
window.addEventListener('resize', () => { if (esAncho()) cerrarFicha(); });

$('#estados').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-estado]');
  if (!b) return;
  st.estado = b.dataset.estado;
  refiltrar();
});

$('#filtro').addEventListener('input', (ev) => { st.filtro = ev.target.value; refiltrar(); });
$('#limpiar-filtro-x').addEventListener('click', () => { limpiarFiltro(); $('#filtro').focus(); });

$('#lista').addEventListener('click', (ev) => {
  if (ev.target.closest('#limpiar-filtro')) { limpiarFiltro(); $('#filtro').focus(); return; }
  if (ev.target.closest('#buscar-colegio')) {
    // Lleva lo escrito a la búsqueda global, que sí abarca todo el colegio.
    st.consulta = st.filtro.trim(); st.resIdx = 0; st.verTodos = false;
    busqueda.value = st.consulta;
    busqueda.focus();
    pintarResultados();
    return;
  }
  const b = ev.target.closest('[data-id]');
  if (b) seleccionar(Number(b.dataset.id), { enfocar: true });
});

$('#ficha').addEventListener('click', (ev) => {
  if (ev.target.closest('#cerrar-ficha')) return cerrarFicha();
});
$('#velo').addEventListener('click', cerrarFicha);

const busqueda = $('#busqueda');
busqueda.addEventListener('input', () => { st.consulta = busqueda.value; st.resIdx = 0; st.verTodos = false; cerrarMenus(); pintarResultados(); });
busqueda.addEventListener('focus', () => { if (st.consulta.trim().length >= 2) pintarResultados(); });
busqueda.addEventListener('keydown', (ev) => {
  const abierto = !$('#resultados').classList.contains('hidden');
  if (ev.key === 'ArrowDown' && abierto) { ev.preventDefault(); st.resIdx = Math.min(st.resIdx + 1, resultados.length - 1); pintarResultados(); }
  else if (ev.key === 'ArrowUp' && abierto) { ev.preventDefault(); st.resIdx = Math.max(st.resIdx - 1, 0); pintarResultados(); }
  else if (ev.key === 'Enter' && abierto) { ev.preventDefault(); elegirResultado(resultados[st.resIdx]); }
});
$('#resultados').addEventListener('mousedown', (ev) => {
  if (ev.target.closest('#ver-todos')) { ev.preventDefault(); st.verTodos = true; pintarResultados(); return; }
  const li = ev.target.closest('[data-res]');
  if (li) { ev.preventDefault(); elegirResultado(resultados[Number(li.dataset.res)]); }
});
$('#resultados').addEventListener('mousemove', (ev) => {
  const li = ev.target.closest('[data-res]');
  if (li && Number(li.dataset.res) !== st.resIdx) {
    st.resIdx = Number(li.dataset.res);
    const lista = $('#lista-resultados'), arriba = lista?.scrollTop ?? 0;
    pintarResultados();
    if ($('#lista-resultados')) $('#lista-resultados').scrollTop = arriba;
  }
});
$('#limpiar-busqueda').addEventListener('click', () => { st.consulta = ''; busqueda.value = ''; pintarResultados(); busqueda.focus(); });

document.addEventListener('mousedown', (ev) => {
  if (st.menu && !ev.target.closest('#menu-grado, #menu-anio, #btn-grado, #btn-anio')) cerrarMenus();
  if (!ev.target.closest('#caja-busqueda') && !ev.target.closest('#buscar-colegio')) cerrarBusqueda();
});

document.addEventListener('keydown', (ev) => {
  const t = ev.target;
  if (ev.key === 'Escape') {
    // Cierra lo que esté encima, de a una capa.
    if (t === busqueda || cerrarBusqueda()) {
      st.consulta = ''; busqueda.value = ''; pintarResultados(); cerrarBusqueda(); busqueda.blur();
      return;
    }
    if (cerrarMenus()) return;
    if (st.abierta) return cerrarFicha();
    if (cerrarAviso()) return;
    if (t === $('#filtro') && st.filtro) limpiarFiltro();
    return;
  }
  if (t === busqueda) return;
  const escribiendo = t.matches?.('input, textarea, select') && t !== $('#filtro');
  if (ev.key === '/' && !t.matches?.('input, textarea')) { ev.preventDefault(); busqueda.focus(); busqueda.select(); return; }
  if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && !escribiendo && !st.menu && !ev.altKey) {
    ev.preventDefault();
    mover(ev.key === 'ArrowDown' ? 1 : -1);
  }
});

iconos();
</script>
</body>
</html>
