<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudiantes · SIEAGE</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=outfit:400,500,600,700" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-[#F5F7FC]">
<!--
  Maqueta A · "Calma" (continuación del Login) · ajuste tras la crítica
  Datos 100 % inventados (datos.json). Solo clases de Tailwind v4.
  Alturas cortas (portátil 1366×657): variantes [@media(max-height:760px)].
  Texto secundario en #56627F / #6B7694 (≥ 4,5:1); #8C97B3 queda solo para íconos y separadores.
-->
<div class="min-h-screen bg-[#F5F7FC] font-['Outfit',ui-sans-serif,system-ui,sans-serif] text-[#16223F] antialiased">

  <!-- ============================================ encabezado global (panel-layout) -->
  <header class="sticky top-0 z-30 border-b border-[#E3E9F6] bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-[1400px] items-center gap-6 px-4 md:px-8 2xl:max-w-[1640px]">
      <a href="#" class="flex shrink-0 items-center gap-3">
        <img src="/sieage-logo.png" alt="SIEAGE" class="h-10 w-auto rounded-md object-contain">
        <div class="hidden leading-tight sm:block">
          <p class="text-[15px] font-semibold tracking-tight">SIEAGE</p>
          <p class="text-xs text-[#56627F]">I.E. Alfonso López Pumarejo</p>
        </div>
      </a>
      <nav class="flex items-center gap-1 rounded-full bg-[#EEF2FB] p-1">
        <a href="#" class="flex items-center gap-2 rounded-full bg-white px-3.5 py-2 text-sm font-medium text-[#1E3A7B] shadow-sm transition">
          <i data-lucide="graduation-cap" class="size-4"></i><span class="hidden md:inline">Estudiantes</span>
        </a>
        <a href="#" class="flex items-center gap-2 rounded-full px-3.5 py-2 text-sm font-medium text-[#56627F] transition hover:text-[#1E3A7B]">
          <i data-lucide="upload-cloud" class="size-4"></i><span class="hidden md:inline">Importar datos</span>
        </a>
      </nav>
      <div class="ml-auto">
        <button class="flex items-center gap-2 rounded-full p-1 pr-3 text-sm transition-colors hover:bg-[#EEF2FB]">
          <span class="flex size-8 items-center justify-center rounded-full bg-neutral-200 text-black">A</span>
          <span class="truncate font-medium">Administrador</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================================ contenido -->
  <main class="mx-auto max-w-[1400px] px-4 py-5 md:px-8 lg:flex lg:h-[calc(100dvh-4rem-1px)] lg:flex-col lg:py-5 2xl:max-w-[1640px] [@media(max-height:760px)]:lg:py-2">

    <!-- ---------------------------------------- banda: título, búsqueda, año, cifras, grados y grupos -->
    <section id="banda" class="relative z-10 shrink-0 rounded-[28px] bg-gradient-to-br from-[#EEF2FB] via-[#E7EDFA] to-[#DCE5F8] px-4 py-5 sm:px-6 [@media(max-height:760px)]:lg:py-3">
      <!-- manchas difusas como en el Login; en su propia capa recortada para que el desplegable pueda salir de la banda -->
      <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden rounded-[28px]">
        <div class="absolute -top-28 right-[18%] size-80 rounded-full bg-white/60 blur-3xl"></div>
        <div class="absolute -bottom-40 -left-20 size-96 rounded-full bg-[#C4D2F1]/60 blur-3xl"></div>
      </div>

      <div class="relative flex flex-wrap items-center gap-x-6 gap-y-4">
        <h1 class="text-[30px] leading-none font-semibold tracking-[-0.03em] [@media(max-height:760px)]:lg:text-[28px]">Estudiantes</h1>

        <!-- búsqueda en todo el colegio -->
        <div class="relative order-last w-full lg:order-none lg:w-[300px] xl:w-[340px] min-[85rem]:w-[400px]">
          <i data-lucide="search" class="pointer-events-none absolute top-1/2 left-4 size-[18px] -translate-y-1/2 text-[#5B7BD0]"></i>
          <input id="buscar" type="search" autocomplete="off" spellcheck="false"
            placeholder="Buscar estudiante por nombre o documento"
            aria-label="Buscar estudiante en todo el colegio por nombre o documento"
            aria-controls="resultados" aria-expanded="false"
            class="h-12 w-full rounded-[16px] border-[1.5px] border-white bg-white pr-11 pl-11 text-[15px] text-[#16223F] shadow-[0_1px_2px_rgba(22,34,63,0.06),0_8px_20px_-14px_rgba(30,58,123,0.35)] outline-none transition placeholder:text-[#6B7694] hover:border-[#D3DDF3] focus:border-[#6E8BD6] focus:ring-4 focus:ring-[#C4D2F1]/70 [&::-webkit-search-cancel-button]:appearance-none [@media(max-height:760px)]:lg:h-10 [@media(max-height:760px)]:lg:rounded-[14px]">
          <kbd id="atajo" class="pointer-events-none absolute top-1/2 right-3.5 -translate-y-1/2 rounded-[7px] border border-[#E3E9F6] bg-[#F5F7FC] px-2 py-0.5 font-['Outfit'] text-[12px] font-medium text-[#56627F]">/</kbd>
          <button id="limpiarBusqueda" type="button" aria-label="Limpiar búsqueda" class="absolute top-1/2 right-2 hidden size-8 -translate-y-1/2 items-center justify-center rounded-full text-[#6B7694] transition hover:bg-[#EEF2FB] hover:text-[#16223F]">
            <i data-lucide="x" class="size-4"></i>
          </button>
          <div id="resultados" role="listbox" aria-label="Resultados en todo el colegio"
            class="absolute top-full left-0 z-40 mt-2 hidden max-h-[calc(100dvh-9rem)] w-full min-w-[min(480px,calc(100vw-2rem))] overflow-y-auto overscroll-contain rounded-[20px] bg-white p-2 shadow-[0_28px_56px_-20px_rgba(22,34,63,0.35),0_2px_6px_rgba(22,34,63,0.06)] ring-1 ring-[#E3E9F6]"></div>
        </div>

        <!-- año lectivo y cifras del año -->
        <div class="flex flex-wrap items-center gap-x-6 gap-y-3 lg:ml-auto">
          <label class="relative flex h-10 items-center rounded-full bg-white/75 pr-2 pl-4 shadow-[0_1px_2px_rgba(22,34,63,0.06)] ring-1 ring-white transition focus-within:ring-2 focus-within:ring-[#5B7BD0] hover:bg-white [@media(max-height:760px)]:lg:h-9">
            <span class="text-[13px] text-[#56627F]">Año</span>
            <select id="anio" aria-label="Año lectivo" class="h-full cursor-pointer appearance-none bg-transparent pr-7 pl-2 text-[15px] font-semibold text-[#16223F] outline-none"></select>
            <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 size-4 text-[#56627F]"></i>
          </label>
          <dl id="cifras" class="flex flex-wrap items-center gap-x-5 gap-y-1"></dl>
        </div>
      </div>

      <!-- grados: control segmentado sin caja; solo el grado elegido lleva relleno -->
      <nav id="grados" aria-label="Grados"
        class="relative -mx-1 mt-4 flex gap-1 overflow-x-auto px-1 py-1 [mask-image:linear-gradient(to_right,black_90%,transparent)] [scrollbar-width:none] lg:mx-0 lg:mt-5 lg:overflow-visible lg:p-0 lg:[mask-image:none] [@media(max-height:760px)]:lg:mt-2.5"></nav>

      <!-- grupos del grado: sin caja; solo el grupo elegido lleva relleno -->
      <div id="grupos" role="group" aria-label="Grupos del grado"
        class="relative -mx-1 mt-2 flex gap-1.5 overflow-x-auto px-1 py-1 [mask-image:linear-gradient(to_right,black_90%,transparent)] [scrollbar-width:none] lg:mx-0 lg:mt-3 lg:overflow-visible lg:p-0 lg:[mask-image:none] [@media(max-height:760px)]:lg:mt-2"></div>
    </section>

    <!-- ---------------------------------------- lista -->
    <!-- isolate: la cabecera fija de columnas (z-10) no puede pasar por encima del desplegable de la banda -->
    <section id="listaCaja" class="relative isolate mt-4 flex min-h-[420px] flex-col overflow-hidden rounded-[24px] bg-white shadow-[0_1px_2px_rgba(22,34,63,0.04),0_14px_36px_-18px_rgba(22,34,63,0.16)] lg:min-h-0 lg:flex-1 [@media(max-height:760px)]:lg:mt-2">
      <!-- título, filtro y estado a la izquierda; reparto a la derecha. La ficha nunca tapa esta barra. -->
      <div id="barra" class="flex shrink-0 flex-wrap items-center gap-x-3 gap-y-3 px-5 py-3.5 lg:h-[64px] lg:flex-nowrap lg:py-0 [@media(max-height:760px)]:lg:h-[46px]">
        <h2 id="tituloLista" class="mr-1 flex shrink-0 items-center gap-2 text-[21px] font-semibold tracking-[-0.02em] [@media(max-height:760px)]:lg:text-[20px]"></h2>
        <div class="relative w-full sm:w-48 min-[85rem]:w-56">
          <i data-lucide="list-filter" class="pointer-events-none absolute top-1/2 left-3.5 size-4 -translate-y-1/2 text-[#6B7694]"></i>
          <input id="filtro" type="search" autocomplete="off" spellcheck="false" placeholder="Filtrar esta lista" aria-label="Filtrar la lista por nombre o documento"
            class="h-10 w-full rounded-[14px] border-[1.5px] border-[#E3E9F6] bg-white pr-3 pl-10 text-[14px] outline-none transition placeholder:text-[#6B7694] hover:border-[#D3DDF3] focus:border-[#6E8BD6] focus:ring-4 focus:ring-[#DCE5F8] disabled:cursor-not-allowed [&::-webkit-search-cancel-button]:appearance-none [@media(max-height:760px)]:lg:h-9">
        </div>
        <div id="estados" role="group" aria-label="Estado" class="flex h-10 shrink-0 items-center gap-0.5 rounded-[14px] bg-[#F5F7FC] p-1 [@media(max-height:760px)]:lg:h-9"></div>
        <p id="resumen" class="hidden min-w-0 flex-1 truncate pl-3 text-right text-[14px] text-[#56627F] md:block"></p>
      </div>

      <div id="lista" class="relative min-h-0 flex-1 overflow-y-auto overscroll-contain px-2 pb-2 transition-[padding] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] [scrollbar-color:#D3DDF3_transparent] [scrollbar-width:thin] motion-reduce:transition-none [@media(max-height:760px)]:lg:pb-1"></div>
    </section>
  </main>

  <!-- ============================================ ficha flotante
       En escritorio flota dentro de la tarjeta de la lista, debajo de su barra: nunca tapa la banda ni los filtros.
       Desde 1600 px de ancho, la lista le deja sitio (no tapa ninguna columna). -->
  <aside id="ficha" role="dialog" aria-modal="false" aria-label="Ficha del estudiante" inert
    class="fixed inset-0 z-40 flex translate-x-[calc(100%+3rem)] flex-col overflow-hidden bg-white opacity-0 shadow-[0_40px_80px_-24px_rgba(22,34,63,0.38),0_8px_24px_-8px_rgba(22,34,63,0.12)] ring-1 ring-[#E3E9F6]/70 transition-[translate,opacity] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] sm:inset-y-3 sm:right-3 sm:left-auto sm:w-[440px] sm:rounded-[24px] lg:z-[5] 2xl:w-[470px] motion-reduce:transition-none"></aside>

  <!-- aviso -->
  <div id="aviso" role="status" aria-live="polite"
    class="pointer-events-none fixed bottom-6 left-1/2 z-50 flex -translate-x-1/2 translate-y-3 items-center gap-2.5 rounded-full bg-[#16223F] px-5 py-3 text-[14px] text-white opacity-0 shadow-[0_18px_40px_-16px_rgba(22,34,63,0.6)] transition duration-300"></div>
</div>

<script>
/* ------------------------------------------------------------------ utilidades */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const fmt = (n) => Number(n).toLocaleString('es-CO');
const iconos = () => window.lucide && lucide.createIcons();

function telefono(t) {
  const d = String(t ?? '').replace(/\D/g, '');
  if (d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3');
  if (d.length === 7) return d.replace(/(\d{3})(\d{4})/, '$1 $2');
  return t;
}
const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function fecha(v) {
  if (!v) return null;
  const [a, m, d] = String(v).slice(0, 10).split('-').map(Number);
  return `${d} ${meses[m - 1]} ${a}`;
}
function edad(v) {
  if (!v) return null;
  const n = new Date(`${v}T00:00:00`), h = new Date();
  let a = h.getFullYear() - n.getFullYear();
  if (h < new Date(h.getFullYear(), n.getMonth(), n.getDate())) a--;
  return a;
}
/** Los nombres vienen "Apellido Apellido Nombre": las iniciales son nombre + primer apellido. */
function iniciales(nombre) {
  const p = String(nombre).split(/\s+/).filter(Boolean);
  if (p.length >= 3) return (p[2][0] + p[0][0]).toUpperCase();
  return p.slice(0, 2).map((x) => x[0]).join('').toUpperCase();
}
const sedeCorta = (s) => ({ 'Central Provivienda': 'Provivienda', 'Purificación Trujillo': 'Purificación' }[s] ?? s);
const gradoCorto = (g) => (g.numero === 0 ? 'Transición' : `${g.numero}°`);
/** Nombre corto del director para fichas angostas: "Luz Dary Palacios" → "Luz P." (el nombre completo va en el title y en el resumen). */
const nombreCorto = (n) => { const p = String(n).split(/\s+/).filter(Boolean); return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : n; };
const plural = (n, uno, varios) => `${fmt(n)} ${n === 1 ? uno : varios}`;
const masComun = (lista) => {
  const m = new Map();
  for (const v of lista) m.set(v, (m.get(v) ?? 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
};

/* Novedades: solo lo que sale de lo normal. Retirado y cancelado comparten el mismo rojo suave. */
const tonos = {
  nuevo: 'bg-[#EEF2FB] text-[#1E3A7B]',
  repitente: 'bg-[#FFF3DD] text-[#8A5A0B]',
  trasladado: 'bg-[#F3EAFB] text-[#6B3A9A]',
  retirado: 'bg-[#FDECEC] text-[#A12B2B]',
  cancelado: 'bg-[#FDECEC] text-[#A12B2B]',
  antiguo: 'bg-[#F1F2F6] text-[#4E566B]',
};
const pastilla = (v, extra = '', texto = null) =>
  `<span class="inline-flex h-6 items-center rounded-full px-2.5 text-[13px] font-medium whitespace-nowrap ${texto ? '' : 'capitalize'} ${tonos[v] ?? tonos.antiguo} ${extra}">${texto ?? esc(v)}</span>`;

/** Cupos del grupo en palabras: "quedan 5", ámbar si quedan 2 o menos, rojo si pasa del cupo. */
function cupo(activos, cupos) {
  const libres = cupos - activos;
  if (libres < 0) return { texto: `${-libres} de más`, tono: 'text-[#B42318]' };
  if (libres === 0) return { texto: 'lleno', tono: 'text-[#8A5A0B]' };
  return { texto: `quedan ${libres}`, tono: libres <= 2 ? 'text-[#8A5A0B]' : 'text-[#1E3A7B]' };
}

const anillo = 'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#5B7BD0] focus-visible:ring-offset-2';

/* ------------------------------------------------------------------ estado */
let D;
const S = {
  gradoId: 11,
  grupoId: null,
  estado: 'activo',
  filtro: '',
  consulta: '',
  resultados: [],
  totalResultados: 0,
  resultadoActivo: 0,
  seleccion: null,
  fichaAbierta: false,
};
const G = {}; // datos del grado ya preparados

function preparar() {
  for (const [id, g] of Object.entries(D.porGrado)) {
    const grupos = g.grupos.map((x) => ({ ...x, activos: Number(x.activos), nuevos: Number(x.nuevos) }));
    const variasSedes = new Set(grupos.map((x) => x.sede_codigo)).size > 1;
    const variasJornadas = new Set(grupos.map((x) => x.jornada)).size > 1;
    grupos.sort((a, b) => (variasSedes ? sedeCorta(a.sede).localeCompare(sedeCorta(b.sede), 'es') : 0) || a.codigo.localeCompare(b.codigo, 'es', { numeric: true }));
    const estudiantes = [...g.estudiantes]
      .map((e) => ({ ...e, gradoId: Number(id), _n: norm(e.nombre), _p: norm(e.nombre).split(/\s+/) }))
      .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    G[id] = {
      grupos, estudiantes, variasSedes, variasJornadas,
      // Lo más común del grado es "lo normal" y no se pinta (en Transición todos son nuevos).
      condicionComun: masComun(estudiantes.map((e) => e.condicion)),
      jornadaComun: masComun(grupos.map((x) => x.jornada)),
      hayModalidad: estudiantes.some((e) => e.modalidad),
    };
  }
}
const gradoActual = () => D.grados.find((g) => g.id === S.gradoId);
const datosActual = () => G[String(S.gradoId)] ?? null;

function coincideEstado(e, clave) {
  if (clave === 'todos') return true;
  return clave === 'activo' ? e.estado === 'activo' : e.estado !== 'activo';
}
function visibles() {
  const d = datosActual();
  if (!d) return [];
  const t = norm(S.filtro.trim());
  return d.estudiantes.filter((e) =>
    (S.grupoId === null || e.grupo_id === S.grupoId) &&
    coincideEstado(e, S.estado) &&
    (!t || e._n.includes(t) || e.numero_documento.includes(t)));
}

/* ------------------------------------------------------------------ banda */
function pintarCifras() {
  const t = D.totales;
  const cifra = (n, etiqueta) => `
    <div class="flex items-baseline gap-2">
      <dd class="text-[22px] leading-none font-semibold tracking-[-0.02em] tabular-nums sm:text-[26px] [@media(max-height:760px)]:lg:text-[24px]">${fmt(n)}</dd>
      <dt class="text-[14px] text-[#56627F]">${etiqueta}</dt>
    </div>`;
  const raya = '<span aria-hidden="true" class="hidden h-6 w-px bg-[#C4D2F1] sm:block"></span>';
  $('#cifras').innerHTML = cifra(t.activos, 'activos') + raya + cifra(t.nuevos, 'nuevos') + raya + cifra(t.retirados, 'retirados');
  // El año en curso se distingue de los cerrados.
  $('#anio').innerHTML = D.anios.map((a) =>
    `<option value="${a.anio}" ${a.anio === D.anio ? 'selected' : ''}>${a.anio} · ${a.estado === 'activo' ? 'en curso' : 'cerrado'}</option>`).join('');
}

function pintarGrados() {
  const niveles = ['preescolar', 'primaria', 'secundaria', 'media'];
  let html = '';
  niveles.forEach((nivel, i) => {
    if (i) html += '<span aria-hidden="true" class="my-3 w-px shrink-0 bg-[#C4D2F1]"></span>';
    for (const g of D.grados.filter((x) => x.nivel === nivel)) {
      const actual = g.id === S.gradoId;
      html += `
        <button type="button" data-grado="${g.id}" ${actual ? 'aria-current="page"' : ''}
          title="${esc(g.nombre)} · ${fmt(g.activos)} activos · ${g.grupos} grupos${actual && S.grupoId !== null ? ' · clic para ver todo el grado' : ''}"
          class="flex h-11 min-w-[4.75rem] shrink-0 cursor-pointer items-center justify-center gap-2 rounded-[14px] px-3 transition-[background-color,box-shadow,color] duration-200 lg:min-w-0 lg:shrink ${g.numero === 0 ? 'flex-[1.55]' : 'flex-1'}
            ${actual ? 'bg-[#1E3A7B] text-white shadow-[0_12px_24px_-12px_rgba(30,58,123,0.75)]' : 'text-[#16223F] hover:bg-white/70'}
            ${anillo} focus-visible:ring-offset-[#E7EDFA] [@media(max-height:760px)]:lg:h-10">
          <span class="text-[16px] font-semibold tracking-[-0.01em]">${g.numero === 0 ? '<span class="lg:hidden xl:inline">Transición</span><span class="hidden lg:inline xl:hidden">Trans.</span>' : gradoCorto(g)}</span>
          <span class="text-[13px] tabular-nums ${actual ? 'text-white/75' : 'text-[#56627F]'}">${g.activos}</span>
        </button>`;
    }
  });
  const nav = $('#grados');
  nav.innerHTML = html;
  // En pantallas angostas el control se desplaza de lado: el grado elegido queda a la vista.
  setTimeout(() => {
    const sel = nav.querySelector('[aria-current]');
    if (sel && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: sel.offsetLeft - (nav.clientWidth - sel.offsetWidth) / 2 });
  }, 80);
}

/**
 * Grupos del grado. Renglón 1: código (y la jornada si es la excepción) + cupos que quedan.
 * Renglón 2: sede (si el grado se reparte), director y nuevos (si no todos lo son).
 * Sin ficha "Todos": ningún grupo elegido = todo el grado; el grupo elegido se quita con otro clic o con la × del título.
 */
function pintarGrupos() {
  const d = datosActual();
  const g = gradoActual();
  const cont = $('#grupos');
  if (!d) {
    cont.innerHTML = `
      <div class="flex h-[58px] flex-1 items-center gap-3 rounded-[16px] border-[1.5px] border-dashed border-[#C4D2F1] px-4 text-[14px] text-[#56627F] [@media(max-height:760px)]:lg:h-[46px]">
        <i data-lucide="info" class="size-[18px] shrink-0 text-[#5B7BD0]"></i>
        <span>Los ${g.grupos} grupos de ${esc(g.nombre)} no vienen en esta maqueta. Prueba con <b class="font-semibold text-[#16223F]">Transición</b> o <b class="font-semibold text-[#16223F]">Décimo</b>.</span>
      </div>`;
    iconos();
    return;
  }
  const verNuevos = d.condicionComun !== 'nuevo';
  // Si la ficha queda angosta (7 grupos en portátil, o sede + director), el director pasa a nombre corto.
  // Clases completas y literales para que Tailwind (y luego React) las vea.
  const [largo, corto] = d.variasSedes
    ? ['@max-[13rem]:hidden', 'hidden @max-[13rem]:inline']
    : ['@max-[11rem]:hidden', 'hidden @max-[11rem]:inline'];
  const punto = '<span aria-hidden="true" class="mx-1.5 shrink-0 text-[#8C97B3]">·</span>';
  cont.innerHTML = d.grupos.map((x) => {
    const elegido = x.id === S.grupoId;
    const c = cupo(x.activos, x.cupos);
    const jornadaRara = d.variasJornadas && x.jornada !== d.jornadaComun;
    const titulo = `${x.codigo} · ${x.sede} · ${x.jornada} · Dir. ${x.director ?? 'sin asignar'} · ${x.activos} de ${x.cupos} cupos · ${plural(x.nuevos, 'nuevo', 'nuevos')}${elegido ? ' · clic para ver todo el grado' : ''}`;
    return `
      <button type="button" data-grupo="${x.id}" aria-pressed="${elegido}" title="${esc(titulo)}"
        class="@container flex h-[58px] min-w-[11rem] flex-1 shrink-0 cursor-pointer flex-col justify-center rounded-[16px] px-3.5 text-left transition-[background-color,box-shadow] duration-200 lg:min-w-0 lg:shrink lg:basis-0
          ${elegido ? 'bg-white shadow-[0_12px_26px_-14px_rgba(30,58,123,0.5)] inset-ring-[1.5px] inset-ring-[#1E3A7B]' : 'hover:bg-white/70'}
          ${anillo} focus-visible:ring-offset-[#E3EAF9] [@media(max-height:760px)]:lg:h-[46px] [@media(max-height:760px)]:lg:px-3">
        <span class="flex items-baseline gap-2">
          <span class="text-[16px] font-semibold tracking-[-0.01em] ${elegido ? 'text-[#1E3A7B]' : ''}">${esc(x.codigo)}</span>
          ${jornadaRara ? `<span class="text-[13px] font-medium text-[#56627F]">${esc(x.jornada)}</span>` : ''}
          <span class="ml-auto text-[14px] font-semibold whitespace-nowrap tabular-nums ${c.tono}">${c.texto}</span>
        </span>
        <span class="mt-0.5 flex min-w-0 items-baseline text-[13px] text-[#56627F]">
          ${d.variasSedes ? `<span class="shrink-0 font-medium text-[#3E4A68]">${esc(sedeCorta(x.sede))}</span>${punto}` : ''}
          <span class="min-w-0 truncate">${x.director
            ? `<span class="${largo}">${esc(x.director)}</span><span class="${corto}">${esc(nombreCorto(x.director))}</span>`
            : 'Sin director'}</span>
          ${verNuevos && x.nuevos ? `${punto}<span class="shrink-0 whitespace-nowrap">${plural(x.nuevos, 'nuevo', 'nuevos')}</span>` : ''}
        </span>
      </button>`;
  }).join('');
}

/* ------------------------------------------------------------------ lista */
const estadosFiltro = [
  { clave: 'activo', nombre: 'Activos' },
  { clave: 'inactivo', nombre: 'Retirados' },
  { clave: 'todos', nombre: 'Todos' },
];

/** Reparto de los activos (del grado o del grupo elegido): siempre a la vista, también con la ficha abierta. */
function resumen() {
  const d = datosActual();
  if (!d) return '';
  const dato = (n, etq) => `<span class="whitespace-nowrap"><b class="font-semibold text-[#16223F] tabular-nums">${fmt(n)}</b> ${esc(etq)}</span>`;
  const sep = '<span aria-hidden="true" class="mx-2 text-[#8C97B3]">·</span>';
  const grupo = d.grupos.find((x) => x.id === S.grupoId);
  const activos = d.estudiantes.filter((e) => e.estado === 'activo' && (!grupo || e.grupo_id === grupo.id));
  const contar = (f) => {
    const m = new Map();
    for (const e of activos) { const k = f(e); if (k) m.set(k, (m.get(k) ?? 0) + 1); }
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };
  // Lo que no varía se dice una sola vez (p. ej. "Principal · Mañana"); lo que varía, con sus cifras.
  const fijo = [];
  if (grupo) fijo.push(`<span class="whitespace-nowrap">Dir. <span class="text-[#16223F]">${esc(grupo.director ?? 'sin asignar')}</span></span>`);
  // Con un grupo elegido, sede y jornada solo se repiten si el grado se reparte (si no, ya se dijeron en la vista del grado).
  if (grupo ? d.variasSedes : !d.variasSedes) fijo.push(esc(grupo ? grupo.sede : d.grupos[0].sede));
  if (grupo ? d.variasJornadas : !d.variasJornadas) fijo.push(esc(grupo ? grupo.jornada : d.grupos[0].jornada));
  let partes = [];
  if (!grupo && d.variasSedes) partes = partes.concat(contar((e) => sedeCorta(e.sede)));
  if (!grupo && d.variasJornadas) partes = partes.concat(contar((e) => e.jornada));
  if (d.hayModalidad) partes = partes.concat(contar((e) => e.modalidad));
  return [...fijo, ...partes.map(([k, v]) => dato(v, k))].join(sep);
}

function pintarEncabezadoLista() {
  const g = gradoActual();
  const d = datosActual();
  const grupo = d?.grupos.find((x) => x.id === S.grupoId);
  $('#tituloLista').innerHTML = `<span>${esc(g.nombre)}</span>${grupo ? `
    <button type="button" id="quitarGrupo" title="Ver todo ${esc(g.nombre)}" aria-label="Quitar el grupo ${esc(grupo.codigo)} y ver todo el grado"
      class="inline-flex h-8 cursor-pointer items-center gap-1.5 rounded-full bg-[#EEF2FB] pr-2 pl-3 text-[15px] font-semibold tracking-normal text-[#1E3A7B] transition hover:bg-[#DCE5F8] ${anillo} [@media(max-height:760px)]:lg:h-7">
      ${esc(grupo.codigo)}${d.variasSedes ? `<span class="font-medium text-[#3E4A68]">· ${esc(sedeCorta(grupo.sede))}</span>` : ''}
      <i data-lucide="x" class="size-4"></i>
    </button>` : ''}`;
  $('#resumen').innerHTML = resumen();
  $('#resumen').title = $('#resumen').textContent.replace(/\s+/g, ' ').trim();
  const base = d ? d.estudiantes.filter((e) => S.grupoId === null || e.grupo_id === S.grupoId) : [];
  $('#estados').innerHTML = estadosFiltro.map((f) => {
    const on = S.estado === f.clave;
    return `<button type="button" data-estado="${f.clave}" aria-pressed="${on}"
      class="flex h-8 cursor-pointer items-center gap-1.5 rounded-[10px] px-3 text-[14px] font-medium whitespace-nowrap transition ${anillo} focus-visible:ring-offset-[#F5F7FC] [@media(max-height:760px)]:lg:h-7
        ${on ? 'bg-white text-[#1E3A7B] shadow-[0_1px_3px_rgba(22,34,63,0.12)]' : 'text-[#56627F] hover:text-[#16223F]'}">
      ${f.nombre}<span class="text-[13px] tabular-nums ${on ? 'text-[#5B7BD0]' : 'text-[#6B7694]'}">${base.filter((e) => coincideEstado(e, f.clave)).length}</span></button>`;
  }).join('');
  $('#estados').classList.toggle('opacity-40', !d);
  $('#estados').classList.toggle('pointer-events-none', !d);
  const f = $('#filtro');
  f.disabled = !d;
  f.classList.toggle('opacity-50', !d);
  f.placeholder = d ? `Filtrar ${g.nombre}${grupo ? ` ${grupo.codigo}` : ''}` : 'Filtrar esta lista';
  iconos();
}

/** El número de lista solo tiene sentido dentro de un grupo, con los activos y sin filtro de texto. */
const numerada = () => S.grupoId !== null && S.estado === 'activo' && !S.filtro.trim();

/**
 * Columnas según el grado: sede y jornada solo si varían; modalidad solo en la media.
 * Nombre y acudiente tienen tope para que, en pantallas anchas, el teléfono no quede lejos del nombre.
 */
function columnas(d) {
  const c = [];
  if (numerada()) c.push({ k: 'n', t: 'N.°', w: '2rem' });
  c.push({ k: 'nombre', t: 'Estudiante', w: 'minmax(14rem,24rem)' });
  c.push({ k: 'doc', t: 'Documento', w: '8rem' });
  // Con un grupo elegido, la columna de grupo sobra: todos son del mismo.
  if (S.grupoId === null) c.push({ k: 'grupo', t: d.variasSedes ? 'Grupo · sede' : 'Grupo', w: d.variasSedes ? '9.5rem' : '4.25rem' });
  if (d.variasJornadas && S.grupoId === null) c.push({ k: 'jornada', t: 'Jornada', w: '5rem' });
  if (d.hayModalidad) c.push({ k: 'modalidad', t: 'Modalidad', w: '6.75rem' });
  c.push({ k: 'acudiente', t: 'Acudiente', w: 'minmax(8rem,18rem)' });
  c.push({ k: 'tel', t: 'Teléfono', w: '6.75rem' });
  c.push({ k: 'fin', t: '', w: 'minmax(0,1fr)' });
  return c;
}

function celda(k, e, i, d) {
  // Los que ya no están se atenúan solo cuando se mezclan con los activos (vista "Todos").
  const retirado = e.estado !== 'activo' && S.estado === 'todos';
  // En celular solo se ven nombre (con documento debajo), grupo y novedad.
  const soloGrande = 'hidden lg:block';
  switch (k) {
    case 'n': return `<span class="${soloGrande} text-right text-[13px] text-[#6B7694] tabular-nums">${i + 1}</span>`;
    case 'nombre': {
      // Novedades junto al nombre y solo si salen de lo normal: nunca "activo" ni la condición común del grado.
      const p = [];
      if (e.condicion !== d.condicionComun) p.push(pastilla(e.condicion, 'shrink-0'));
      // En la vista "Retirados" lo normal es estar retirado: solo se marcan los cancelados o trasladados.
      if (e.estado !== 'activo' && !(S.estado === 'inactivo' && e.estado === 'retirado')) p.push(pastilla(e.estado, 'shrink-0'));
      return `
      <span class="min-w-0">
        <span class="flex min-w-0 items-center gap-2">
          <span class="truncate font-medium group-aria-selected:text-[#1E3A7B] ${retirado ? 'text-[#56627F]' : ''}" title="${esc(e.nombre)}">${esc(e.nombre)}</span>${p.join('')}
        </span>
        <span class="block truncate text-[13px] text-[#56627F] tabular-nums lg:hidden">${esc(e.tipo_documento)} ${esc(e.numero_documento)}</span>
      </span>`;
    }
    case 'doc': return `<span class="${soloGrande} truncate text-[14px] text-[#3E4A68] tabular-nums"><span class="text-[#6B7694]">${esc(e.tipo_documento)}</span> ${esc(e.numero_documento)}</span>`;
    case 'grupo': return `<span class="flex min-w-0 items-baseline gap-2"><span class="font-semibold tabular-nums">${esc(e.grupo ?? '—')}</span>${d.variasSedes ? `<span class="hidden truncate text-[14px] text-[#56627F] lg:inline">${esc(sedeCorta(e.sede))}</span>` : ''}</span>`;
    case 'jornada': return `<span class="${soloGrande} text-[14px] ${e.jornada === d.jornadaComun ? 'text-[#56627F]' : 'font-medium text-[#16223F]'}">${esc(e.jornada ?? '—')}</span>`;
    case 'modalidad': return e.modalidad ? `<span class="${soloGrande} truncate text-[14px] text-[#3E4A68]">${esc(e.modalidad)}</span>` : `<span class="${soloGrande} text-[14px] text-[#6B7694]">—</span>`;
    case 'acudiente': return e.acudiente ? `<span class="${soloGrande} truncate text-[14px] text-[#3E4A68]" title="${esc(e.acudiente)}">${esc(e.acudiente)}</span>` : `<span class="${soloGrande} text-[14px] text-[#6B7694]">Sin registrar</span>`;
    case 'tel': return e.telefono ? `<span class="${soloGrande} text-[14px] text-[#3E4A68] tabular-nums">${telefono(e.telefono)}</span>` : `<span class="${soloGrande} text-[14px] text-[#6B7694]">Sin teléfono</span>`;
    case 'fin': return `<span class="${soloGrande}"></span>`;
  }
}

function pintarLista({ conservarScroll = false } = {}) {
  const lista = $('#lista');
  const d = datosActual();
  const g = gradoActual();
  if (!d) {
    lista.innerHTML = `
      <div class="flex h-full min-h-[300px] flex-col items-center justify-center gap-3 px-6 text-center">
        <span class="flex size-14 items-center justify-center rounded-[18px] bg-[#EEF2FB] text-[#5B7BD0]"><i data-lucide="folder-open" class="size-6"></i></span>
        <p class="mt-1 text-[19px] font-semibold tracking-[-0.01em]">${esc(g.nombre)} no tiene datos en la maqueta</p>
        <p class="max-w-md text-[15px] leading-relaxed text-[#56627F]">En la aplicación aquí aparecerían sus ${fmt(g.activos)} estudiantes activos, repartidos en ${g.grupos} grupos.</p>
        <div class="mt-2 flex gap-2">
          <button type="button" data-grado="1" class="h-10 cursor-pointer rounded-[14px] border-[1.5px] border-[#D3DDF3] px-4 text-[14px] font-semibold text-[#1E3A7B] transition hover:border-[#1E3A7B] ${anillo}">Ver Transición</button>
          <button type="button" data-grado="11" class="h-10 cursor-pointer rounded-[14px] bg-[#1E3A7B] px-4 text-[14px] font-semibold text-white shadow-[0_10px_20px_-12px_rgba(30,58,123,0.7)] transition hover:bg-[#172E63] ${anillo}">Ver Décimo</button>
        </div>
      </div>`;
    iconos();
    return;
  }
  const cols = columnas(d);
  const plantilla = `lg:grid-cols-[${cols.map((c) => c.w).join('_')}]`;
  const vs = visibles();
  const scroll = lista.scrollTop;
  let html = `
    <div role="row" class="sticky top-0 z-10 hidden h-9 ${plantilla} items-center gap-x-3.5 bg-white/95 px-3 text-[12px] font-medium tracking-[0.06em] text-[#6B7694] uppercase backdrop-blur lg:grid [@media(max-height:760px)]:lg:h-7">
      ${cols.map((c) => `<span class="truncate ${c.k === 'n' ? 'text-right' : ''}">${c.t}</span>`).join('')}
    </div>`;
  if (!vs.length) {
    html += `
      <div class="flex flex-col items-center justify-center gap-2 px-6 py-14 text-center">
        <p class="text-[16px] font-semibold">Nadie coincide con estos filtros</p>
        <p class="text-[14px] text-[#56627F]">Prueba con otro nombre o cambia el estado.</p>
        <button type="button" id="limpiarFiltros" class="mt-2 h-10 cursor-pointer rounded-[14px] border-[1.5px] border-[#D3DDF3] px-4 text-[14px] font-semibold text-[#1E3A7B] transition hover:border-[#1E3A7B] ${anillo}">Limpiar filtros</button>
      </div>`;
  }
  vs.forEach((e, i) => {
    const sel = e.id === S.seleccion;
    html += `
      <div role="row" tabindex="${sel || (S.seleccion === null && i === 0) ? 0 : -1}" data-id="${e.id}" aria-selected="${sel}"
        class="fila group grid min-h-14 cursor-pointer grid-cols-[minmax(0,1fr)_auto] scroll-mt-10 items-center gap-x-3 rounded-[12px] px-3 py-2 text-[15px] outline-none transition-colors duration-150
          even:bg-[#F7F9FD] hover:bg-[#EFF3FB] focus-visible:ring-2 focus-visible:ring-[#5B7BD0]/60 aria-selected:bg-[#E6EDFB]
          lg:h-11 lg:min-h-0 ${plantilla} lg:gap-x-3.5 lg:py-0 [@media(max-height:760px)]:lg:h-10">
        ${cols.map((c) => celda(c.k, e, i, d)).join('')}
      </div>`;
  });
  lista.innerHTML = html;
  lista.scrollTop = conservarScroll ? scroll : 0;
  iconos();
}

/* Cambiar la fila elegida sin volver a pintar toda la lista. */
function marcarSeleccion() {
  for (const f of document.querySelectorAll('#lista .fila')) {
    const sel = Number(f.dataset.id) === S.seleccion;
    f.setAttribute('aria-selected', sel);
    f.tabIndex = sel ? 0 : -1;
  }
}

/* ------------------------------------------------------------------ ficha */

  const aside = $('#ficha');

  if (!f) { aside.innerHTML = ''; return; }

  const bloque = (titulo, cuerpo) => `

      <div aria-hidden="true" class="pointer-events-none absolute -top-20 -right-16 size-56 rounded-full bg-white/60 blur-3xl"></div>

        <span class="flex size-12 shrink-0 items-center justify-center rounded-[16px] bg-[#1E3A7B] text-[16px] font-semibold text-white shadow-[0_14px_26px_-14px_rgba(30,58,123,0.8)] ${corto}:size-10 ${corto}:rounded-[14px] ${corto}:text-[15px]">${iniciales(e.nombre_completo)}</span>
        <div class="min-w-0 flex-1 pt-0.5 ${corto}:pt-0">
          <h2 class="text-[21px] leading-[1.2] font-semibold tracking-[-0.02em] text-balance ${corto}:text-[19px]">${esc(e.nombre_completo)}</h2>
          <p class="mt-0.5 text-[14px] text-[#3E4A68] tabular-nums">${esc(e.tipo_documento)} ${esc(e.numero_documento)}${anios !== null ? ` · ${anios} años` : ''}${a ? ` · <b class="font-semibold text-[#1E3A7B]">${esc(a.grupo ?? a.grado)}</b> · ${a.anio}` : ''}</p>

          class="-mt-1 -mr-1 flex size-9 shrink-0 cursor-pointer items-center justify-center rounded-full bg-white/70 text-[#56627F] transition hover:bg-white hover:text-[#16223F] ${anillo} focus-visible:ring-offset-[#E7EDFA]">
          <i data-lucide="x" class="size-5"></i>
        </button>

      <a href="/estudiantes/${e.id}"
        class="relative mt-4 flex h-10 items-center justify-center gap-2 rounded-[13px] bg-[#1E3A7B] text-[15px] font-semibold text-white shadow-[0_12px_24px_-12px_rgba(30,58,123,0.6)] transition-all duration-200 hover:bg-[#172E63] hover:shadow-[0_16px_28px_-12px_rgba(30,58,123,0.7)] focus-visible:ring-4 focus-visible:ring-[#B7C6EA] focus-visible:outline-none active:scale-[0.98] ${corto}:mt-3 ${corto}:h-9 ${corto}:rounded-[12px] ${corto}:text-[14px]">

      </a>

    <div id="fichaCuerpo" class="min-h-0 flex-1 overflow-y-auto overscroll-contain pb-5 [scrollbar-color:#D3DDF3_transparent] [scrollbar-width:thin]">

        <div class="space-y-1 text-[14px] leading-relaxed text-[#3E4A68]">
          <p><span class="font-medium text-[#16223F]">${esc(a.grado)}</span> · ${esc([a.sede, a.jornada, a.modalidad].filter(Boolean).join(' · '))}</p>
          <p>${[a.fecha_matricula && `Matriculado el ${fecha(a.fecha_matricula)}`, e.fecha_nacimiento && `nació el ${fecha(e.fecha_nacimiento)}`].filter(Boolean).join(' · ').replace(/^n/, 'N')}</p>
          ${noActivo ? `
            <p class="flex items-start gap-2 pt-1 text-[#A12B2B]">
              <i data-lucide="log-out" class="mt-[3px] size-4 shrink-0"></i>
              <span><span class="font-semibold capitalize">${esc(a.estado)}</span>${a.fecha_retiro ? ` el ${fecha(a.fecha_retiro)}` : ''}${a.motivo_retiro ? ` · ${esc(a.motivo_retiro)}` : ''}</span></p>` : ''}
        </div>
        ${a.observaciones ? `
          <p class="mt-3 flex items-start gap-2.5 rounded-[14px] bg-[#FFF8EB] px-3.5 py-2.5 text-[14px] leading-relaxed text-[#5C4210]">
            <i data-lucide="sticky-note" class="mt-[3px] size-4 shrink-0 text-[#B07A1E]"></i>${esc(a.observaciones)}</p>` : ''}`) : ''}

      ${historia.length ? bloque('Historia en el colegio', `
        <ol class="relative">
          ${historia.map((h, i) => {
            const ultimo = i === historia.length - 1;
            const nota = [];
            if (h.condicion === 'repitente') nota.push('<span class="text-[#8A5A0B]">repitió</span>');
            if (h.estado !== 'activo') nota.push(`<span class="text-[#A12B2B]">${esc(h.estado)}</span>`);
            return `
            <li class="relative grid grid-cols-[3rem_1.25rem_minmax(0,1fr)] gap-x-2 ${ultimo ? '' : 'pb-3'}">
              <span class="pt-px text-[15px] font-semibold tabular-nums ${i ? 'text-[#56627F]' : ''}">${h.anio}</span>
              <span class="relative flex justify-center">
                ${ultimo ? '' : '<span aria-hidden="true" class="absolute top-3 -bottom-3 w-px bg-[#DCE5F8]"></span>'}
                <span aria-hidden="true" class="relative mt-[7px] size-2.5 rounded-full ${i ? 'bg-white ring-2 ring-[#C4D2F1]' : 'bg-[#1E3A7B] ring-4 ring-[#DCE5F8]'}"></span>
              </span>
              <div class="min-w-0">
                <p class="text-[15px]"><span class="font-medium">${esc(h.grado)}</span>${h.grupo ? ` · ${esc(h.grupo)}` : ''}${nota.length ? ` <span class="text-[14px]">· ${nota.join(' · ')}</span>` : ''}</p>
                <p class="text-[13px] text-[#56627F]">${esc([h.sede, h.jornada, h.grado_numero >= 10 ? h.modalidad : null].filter(Boolean).join(' · '))}</p>
              </div>
            </li>`;
          }).join('')}
        </ol>`) : ''}
    </div>

    <div class="hidden shrink-0 items-center gap-2 border-t border-[#EEF2F9] px-6 py-3 text-[13px] text-[#56627F] lg:flex ${corto}:hidden">
      <kbd class="rounded-[6px] bg-[#F5F7FC] px-1.5 py-0.5 font-['Outfit'] text-[12px] font-medium text-[#3E4A68] ring-1 ring-[#E3E9F6]">↑</kbd>
      <kbd class="rounded-[6px] bg-[#F5F7FC] px-1.5 py-0.5 font-['Outfit'] text-[12px] font-medium text-[#3E4A68] ring-1 ring-[#E3E9F6]">↓</kbd>
      <span>otro estudiante</span>
      <span class="mx-1 text-[#8C97B3]">·</span>
      <kbd class="rounded-[6px] bg-[#F5F7FC] px-1.5 py-0.5 font-['Outfit'] text-[12px] font-medium text-[#3E4A68] ring-1 ring-[#E3E9F6]">Esc</kbd>
      <span>cerrar</span>
    </div>`;
  iconos();
}

/**
 * En escritorio la ficha flota dentro de la tarjeta de la lista: arranca justo debajo de su barra
 * (título, filtro, estado y reparto quedan a la vista) y deja 8 px de margen a la derecha y abajo.
 * Nunca tapa la banda: grados, grupos, cifras y búsqueda siguen a mano con la ficha abierta.
 */
function ubicarFicha() {
  const a = $('#ficha');
  if (innerWidth < 1024) { a.style.top = a.style.right = a.style.bottom = ''; return; }
  const caja = $('#listaCaja').getBoundingClientRect();
  const barra = $('#barra').getBoundingClientRect();
  a.style.top = `${Math.round(barra.bottom)}px`;
  a.style.bottom = `${Math.round(innerHeight - caja.bottom + 8)}px`;
  a.style.right = `${Math.round(innerWidth - caja.right + 8)}px`;
}
/** Desde 1600 px la lista le deja sitio a la ficha en vez de quedar debajo (470 + 8 de margen + 16 de aire). */
function empujar(on) {
  $('#lista').classList.toggle('min-[100rem]:pr-[494px]', on);
}

function abrirFicha() {
  ubicarFicha();
  S.fichaAbierta = true;
  const a = $('#ficha');
  a.inert = false;
  a.classList.remove('translate-x-[calc(100%+3rem)]', 'opacity-0');
  a.classList.add('translate-x-0', 'opacity-100');
  empujar(true);
}
function cerrarFicha() {
  S.fichaAbierta = false;
  const a = $('#ficha');
  a.inert = true;
  a.classList.add('translate-x-[calc(100%+3rem)]', 'opacity-0');
  a.classList.remove('translate-x-0', 'opacity-100');
  empujar(false);
  document.querySelector(`#lista .fila[data-id="${S.seleccion}"]`)?.focus({ preventScroll: true });
}

function seleccionar(id, { abrir = true, centrar = false } = {}) {
  S.seleccion = id;
  marcarSeleccion();
  const fila = document.querySelector(`#lista .fila[data-id="${id}"]`);
  if (fila) fila.scrollIntoView({ block: centrar ? 'center' : 'nearest' });
  if (abrir || S.fichaAbierta) {
    pintarFicha();
    $('#fichaCuerpo') && ($('#fichaCuerpo').scrollTop = 0);
    if (abrir) abrirFicha();
  }
}

function mover(paso) {
  const vs = visibles();
  if (!vs.length) return;
  const i = vs.findIndex((v) => v.id === S.seleccion);
  const sig = vs[i === -1 ? (paso > 0 ? 0 : vs.length - 1) : Math.min(Math.max(i + paso, 0), vs.length - 1)];
  seleccionar(sig.id, { abrir: S.fichaAbierta });
  const fila = document.querySelector(`#lista .fila[data-id="${sig.id}"]`);
  if (document.activeElement?.closest('#lista') || document.activeElement === document.body) fila?.focus({ preventScroll: true });
}

/* ------------------------------------------------------------------ búsqueda global */
/* 8 resultados en monitores; 6 en portátiles para que el pie "y N más" no quede fuera de la ventana. */
const maxResultados = () => (innerHeight <= 760 ? 6 : 8);
/**
 * Relevancia: el primer apellido empieza por lo escrito > el segundo apellido > el nombre > lo contiene.
 * A igual relevancia: activos primero, luego el grado que se está viendo, luego el orden alfabético.
 */
function relevancia(e, palabras, q) {
  if (/^\d+$/.test(q)) return e.numero_documento.startsWith(q) ? 0 : 3;
  let s = 0;
  palabras.forEach((p, i) => {
    const pos = e._p.findIndex((w) => w.startsWith(p));
    if (pos === -1) s += 3;
    else if (i === 0) s += pos === 0 ? 0 : pos === 1 ? 1 : 2;
    else s += 0.5;
  });
  return s;
}
function buscar() {
  const q = norm(S.consulta.trim());
  const caja = $('#resultados');
  const input = $('#buscar');
  $('#atajo').classList.toggle('hidden', !!S.consulta);
  $('#limpiarBusqueda').classList.toggle('hidden', !S.consulta);
  $('#limpiarBusqueda').classList.toggle('flex', !!S.consulta);
  if (q.length < 2) { caja.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); return; }
  const todos = Object.values(G).flatMap((g) => g.estudiantes);
  const palabras = q.split(/\s+/);
  const encontrados = todos
    .filter((e) => palabras.every((p) => e._n.includes(p)) || e.numero_documento.includes(q))
    .map((e) => ({ e, r: relevancia(e, palabras, q) }))
    .sort((a, b) => a.r - b.r
      || (a.e.estado === 'activo' ? 0 : 1) - (b.e.estado === 'activo' ? 0 : 1)
      || (a.e.gradoId === S.gradoId ? 0 : 1) - (b.e.gradoId === S.gradoId ? 0 : 1)
      || a.e.nombre.localeCompare(b.e.nombre, 'es'))
    .map((x) => x.e);
  S.totalResultados = encontrados.length;
  S.resultados = encontrados.slice(0, maxResultados());
  S.resultadoActivo = Math.min(S.resultadoActivo, Math.max(S.resultados.length - 1, 0));
  const mas = S.totalResultados - S.resultados.length;
  caja.innerHTML = `
    ${S.resultados.length ? `<p class="px-3 pt-1.5 pb-2 text-[13px] text-[#56627F]">${plural(S.totalResultados, 'coincidencia', 'coincidencias')} en todo el colegio · ${D.anio}</p>` : ''}
    ${S.resultados.length ? S.resultados.map((e, i) => {
      const g = D.grados.find((x) => x.id === e.gradoId);
      return `
      <button type="button" role="option" data-resultado="${e.id}" aria-selected="${i === S.resultadoActivo}"
        class="flex w-full cursor-pointer items-center gap-3 rounded-[14px] px-3 py-2 text-left transition-colors hover:bg-[#F5F7FC] aria-selected:bg-[#EEF2FB]">
        <span class="flex size-9 shrink-0 items-center justify-center rounded-[12px] bg-white text-[13px] font-semibold text-[#1E3A7B] ring-1 ring-[#DCE5F8]">${iniciales(e.nombre)}</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-[15px] font-medium">${esc(e.nombre)}</span>
          <span class="block truncate text-[13px] text-[#56627F] tabular-nums">${esc(e.tipo_documento)} ${esc(e.numero_documento)}</span>
        </span>
        <span class="shrink-0 text-right">
          <span class="block text-[14px] font-semibold text-[#1E3A7B]">${esc(g.nombre)} ${esc(e.grupo ?? '')}</span>
          <span class="block text-[13px] capitalize ${e.estado === 'activo' ? 'text-[#56627F]' : 'text-[#A12B2B]'}">${e.estado === 'activo' ? esc(sedeCorta(e.sede)) : esc(e.estado)}</span>
        </span>
      </button>`;
    }).join('') : `<p class="px-3 pt-2 pb-3 text-[15px] text-[#56627F]">Nadie coincide con «${esc(S.consulta.trim())}».</p>`}
    ${mas > 0 ? `<p class="mt-1 border-t border-[#EEF2F9] px-3 pt-2.5 pb-1.5 text-[13px] text-[#56627F]">y ${plural(mas, 'coincidencia más', 'coincidencias más')} · sigue escribiendo para afinar</p>` : ''}`;
  caja.classList.remove('hidden');
  input.setAttribute('aria-expanded', 'true');
}
function cerrarBusqueda(limpiar = false) {
  $('#resultados').classList.add('hidden');
  $('#buscar').setAttribute('aria-expanded', 'false');
  if (limpiar) { S.consulta = ''; $('#buscar').value = ''; buscar(); }
}
function elegirResultado(id) {
  const e = Object.values(G).flatMap((g) => g.estudiantes).find((x) => x.id === id);
  if (!e) return;
  cerrarBusqueda(true);
  $('#buscar').blur();
  const cambioGrado = e.gradoId !== S.gradoId;
  S.gradoId = e.gradoId;
  if (cambioGrado || (S.grupoId !== null && S.grupoId !== e.grupo_id)) S.grupoId = null;
  // Si el estado elegido lo oculta: activos a "Activos"; retirados o cancelados a "Todos".
  if (!coincideEstado(e, S.estado)) S.estado = e.estado === 'activo' ? 'activo' : 'todos';
  S.filtro = ''; $('#filtro').value = '';
  pintarTodo();
  seleccionar(e.id, { abrir: true, centrar: true });
}

/* ------------------------------------------------------------------ aviso */
let temporizador;
function avisar(texto) {
  const a = $('#aviso');
  a.innerHTML = `<i data-lucide="info" class="size-4 text-[#C4D2F1]"></i>${esc(texto)}`;
  iconos();
  a.classList.remove('opacity-0', 'translate-y-3');
  clearTimeout(temporizador);
  temporizador = setTimeout(() => a.classList.add('opacity-0', 'translate-y-3'), 2800);
}

/* ------------------------------------------------------------------ pintar */
function pintarTodo() {
  pintarGrados();
  pintarGrupos();
  pintarEncabezadoLista();
  pintarLista();
  iconos();
}
function elegirGrupo(id) {
  S.grupoId = id;
  pintarGrados(); pintarGrupos(); pintarEncabezadoLista(); pintarLista(); iconos();
  if (S.seleccion !== null) {
    marcarSeleccion();
    document.querySelector(`#lista .fila[data-id="${S.seleccion}"]`)?.scrollIntoView({ block: 'nearest' });
  }
}

/* ------------------------------------------------------------------ eventos */
function eventos() {
  document.addEventListener('click', (ev) => {
    const grado = ev.target.closest('[data-grado]');
    if (grado) {
      const id = Number(grado.dataset.grado);
      if (id !== S.gradoId) {
        S.gradoId = id; S.grupoId = null; S.filtro = ''; $('#filtro').value = '';
        if (S.fichaAbierta) cerrarFicha();
        S.seleccion = null;
        pintarTodo();
      } else if (S.grupoId !== null) {
        elegirGrupo(null); // el grado elegido, pulsado otra vez, vuelve a todo el grado
      }
      return;
    }
    const grupo = ev.target.closest('[data-grupo]');
    if (grupo) { const id = Number(grupo.dataset.grupo); elegirGrupo(S.grupoId === id ? null : id); return; }
    if (ev.target.closest('#quitarGrupo')) { elegirGrupo(null); return; }
    const est = ev.target.closest('[data-estado]');
    if (est) { S.estado = est.dataset.estado; pintarEncabezadoLista(); pintarLista(); marcarSeleccion(); return; }
    const fila = ev.target.closest('#lista .fila');
    if (fila) { seleccionar(Number(fila.dataset.id), { abrir: true }); fila.focus({ preventScroll: true }); return; }
    if (ev.target.closest('#cerrarFicha')) { cerrarFicha(); return; }
    if (ev.target.closest('#limpiarFiltros')) {
      S.filtro = ''; $('#filtro').value = ''; S.estado = 'activo'; S.grupoId = null;
      pintarGrados(); pintarGrupos(); pintarEncabezadoLista(); pintarLista(); iconos(); return;
    }
    const r = ev.target.closest('[data-resultado]');
    if (r) { elegirResultado(Number(r.dataset.resultado)); return; }
    if (ev.target.closest('#limpiarBusqueda')) { cerrarBusqueda(true); $('#buscar').focus(); return; }
    if (!ev.target.closest('#buscar') && !ev.target.closest('#resultados')) cerrarBusqueda();
    if (ev.target.closest('a[href^="/estudiantes/"]')) { ev.preventDefault(); avisar('En la aplicación se abre la ficha completa lista para imprimir.'); }
    if (ev.target.closest('a[href^="tel:"], a[href^="mailto:"]')) { ev.preventDefault(); avisar('En la aplicación este botón llama o abre el correo.'); }
  });

  addEventListener('resize', () => { if (S.fichaAbierta) ubicarFicha(); });
  $('#buscar').addEventListener('input', (ev) => { S.consulta = ev.target.value; S.resultadoActivo = 0; buscar(); });
  $('#buscar').addEventListener('focus', () => { if (S.consulta.trim().length >= 2) buscar(); });
  $('#filtro').addEventListener('input', (ev) => { S.filtro = ev.target.value; pintarLista(); marcarSeleccion(); });
  $('#anio').addEventListener('change', (ev) => {
    if (Number(ev.target.value) !== D.anio) {
      avisar(`La maqueta solo trae datos de ${D.anio}. En la aplicación verías ${ev.target.value} (cerrado).`);
      ev.target.value = D.anio;
    }
  });

  document.addEventListener('keydown', (ev) => {
    const enBusqueda = ev.target === $('#buscar');
    const enCampo = ev.target.matches?.('input, select, textarea') && ev.target !== $('#filtro');

    if (ev.key === '/' && !ev.target.matches?.('input, select, textarea')) {
      ev.preventDefault(); $('#buscar').focus(); $('#buscar').select(); return;
    }
    if (ev.key === 'Escape') {
      if (!$('#resultados').classList.contains('hidden')) { ev.preventDefault(); cerrarBusqueda(); return; }
      if (S.fichaAbierta) { ev.preventDefault(); cerrarFicha(); return; }
      if (ev.target === $('#filtro') && S.filtro) { S.filtro = ''; ev.target.value = ''; pintarLista(); marcarSeleccion(); }
      if (enBusqueda && S.consulta) cerrarBusqueda(true);
      return;
    }
    if (enBusqueda && !$('#resultados').classList.contains('hidden')) {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const n = S.resultados.length;
        if (!n) return;
        S.resultadoActivo = (S.resultadoActivo + (ev.key === 'ArrowDown' ? 1 : -1) + n) % n;
        document.querySelectorAll('[data-resultado]').forEach((b, i) => b.setAttribute('aria-selected', i === S.resultadoActivo));
        return;
      }
      if (ev.key === 'Enter') { ev.preventDefault(); const r = S.resultados[S.resultadoActivo]; if (r) elegirResultado(r.id); return; }
    }
    if (enCampo) return;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); mover(ev.key === 'ArrowDown' ? 1 : -1); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest?.('#lista .fila')) {
      ev.preventDefault(); seleccionar(Number(ev.target.closest('.fila').dataset.id), { abrir: true });
    }
  });
}

/* ------------------------------------------------------------------ arranque */
fetch('datos.json')
  .then((r) => r.json())
  .then((datos) => {
    D = datos;
    preparar();
    pintarCifras();
    pintarTodo();
    eventos();
  });
</script>
